packages:
  - apps/*
  - packages/*

allowBuilds:
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
  agent-browser: true
  bufferutil: true
  core-js: true
  esbuild: true
  protobufjs: true
  # sharp ships prebuilt platform binaries; running its install script can
  # incorrectly force a source build when system libvips is present.
  sharp: false
  utf-8-validate: true
  vue-demi: true
  workerd: true

minimumReleaseAge: 720
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types"
  - "@clerk/*"

overrides:
  "concurrently>shell-quote": 1.10.0
  "jayson>uuid": 11.1.1
  postcss: 8.5.25
  sharp: 0.35.0
