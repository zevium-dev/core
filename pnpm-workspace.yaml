packages:
  - apps/*
  - packages/*

allowBuilds:
  "@parcel/watcher": true
  "@tailwindcss/oxide": true
  bufferutil: true
  core-js: true
  esbuild: true
  protobufjs: true
  # sharp ships prebuilt platform binaries; running its install script can
  # incorrectly force a source build when system libvips is present.
  sharp: false
  utf-8-validate: true
  vue-demi: true
  workerd: true

minimumReleaseAge: 720
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types"
  - "@clerk/*"

overrides:
  "jayson>uuid": 11.1.0
