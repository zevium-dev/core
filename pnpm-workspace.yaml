packages:
  - apps/*
  - packages/*

registry: https://registry.npmjs.org/
trustLockfile: false
verifyStoreIntegrity: true
strictDepBuilds: true

allowBuilds:
  agent-browser: true
  "@tailwindcss/oxide": false
  bufferutil: true
  esbuild: true
  fsevents: false
  # sharp ships prebuilt platform binaries; running its install script can
  # incorrectly force a source build when system libvips is present.
  sharp: false
  utf-8-validate: true
  workerd: true

minimumReleaseAge: 720
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types"
  - "@clerk/*"

overrides:
  "concurrently>shell-quote": 1.10.0
  "jayson>uuid": 11.1.1
  postcss: 8.5.25
  sharp: 0.35.0
