packages:
  - apps/*
  - packages/*

# Share dependency graphs between worktrees. Reflink package contents on
# Btrfs/APFS; copy on filesystems that cannot clone.
enableGlobalVirtualStore: true
packageImportMethod: clone-or-copy

registry: https://registry.npmjs.org/
trustLockfile: false
verifyStoreIntegrity: true
strictDepBuilds: true

allowBuilds:
  agent-browser: true
  "@tailwindcss/oxide": false
  bufferutil: true
  esbuild: true
  fsevents: false
  # sharp ships prebuilt platform binaries; running its install script can
  # incorrectly force a source build when system libvips is present.
  sharp: false
  utf-8-validate: true
  workerd: true

minimumReleaseAge: 720
minimumReleaseAgeStrict: true
minimumReleaseAgeExclude:
  - "@cloudflare/workers-types"
  - "@clerk/*"

packageExtensions:
  # Published declarations import React types, but the package omits this peer.
  # Declare it so type resolution works outside a project-local virtual store.
  next-themes@0.4.6:
    peerDependencies:
      "@types/react": "*"
    peerDependenciesMeta:
      "@types/react":
        optional: true

overrides:
  # Lezer NodeProp ids must come from one module across parser and highlighter.
  "@lezer/common": 1.5.3
  undici: 7.30.0
  "concurrently>shell-quote": 1.10.0
  "jayson>uuid": 11.1.1
  postcss: 8.5.25
  sharp: 0.35.4
  js-yaml: 4.3.2
