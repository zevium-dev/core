name: Immutable Release Policy Review

on:
  pull_request_target:
    branches: [develop]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: release-policy-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  actions: read
  attestations: write
  contents: read
  id-token: write

env:
  RELEASE_REFEREE_REF: ${{ vars.RELEASE_REFEREE_REF }}
  RELEASE_REFEREE_SHA256: ${{ vars.RELEASE_REFEREE_SHA256 }}
  RELEASE_POLICY_TREE_SHA256: ${{ vars.RELEASE_POLICY_TREE_SHA256 }}

jobs:
  security:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          version: 2026.7.13
          install: true
          install_args: node@24.15.0 npm:pnpm@11.8.0 actionlint@1.7.12 gitleaks@8.30.1 shellcheck@0.11.0
      - name: Verify exact Node and pnpm
        run: |
          test "$(node --version)" = "v24.15.0"
          test "$(pnpm --version)" = "11.8.0"
      - name: Verify dependency bootstrap policy
        run: node scripts/audit-preflight.mjs
      - name: Install dependencies without lifecycle scripts
        run: pnpm --filter . install --frozen-lockfile --ignore-pnpmfile --ignore-scripts --registry=https://registry.npmjs.org/ --config.trust-lockfile=false --config.verify-store-integrity=true
      - name: Verify dependency supply chain
        run: node scripts/audit.mjs

  evaluate:
    needs: [security]
    if: github.event.pull_request.draft == false
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    environment: production-policy
    steps:
      - name: Candidate-independent protected-base and target guard
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$BASE_REF" = develop
          [[ "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$TARGET_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]
          gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '
            [
              .state == "open",
              (.draft | not),
              .base.ref == "develop",
              .base.repo.full_name == env.GITHUB_REPOSITORY,
              .head.repo.full_name == env.GITHUB_REPOSITORY,
              .base.sha == env.BASE_SHA,
              .head.sha == env.TARGET_SHA
            ] | all' | grep -qx true

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ vars.RELEASE_REFEREE_REF }}
          fetch-depth: 0
          persist-credentials: false
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          version: 2026.7.13
          install: true
          install_args: node@24.15.0 npm:pnpm@11.8.0 actionlint@1.7.12 gitleaks@8.30.1 shellcheck@0.11.0
      - name: Verify exact Node and pnpm
        run: |
          test "$(node --version)" = "v24.15.0"
          test "$(pnpm --version)" = "11.8.0"
      - name: Install protected-base evaluator dependencies
        run: pnpm install --frozen-lockfile

      - name: Evaluate candidate with immutable org-pinned referee
        id: policy
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          TARGET_SHA: ${{ github.event.pull_request.head.sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_REFEREE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_REFEREE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_POLICY_TREE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          test "$(git rev-parse HEAD)" = "$RELEASE_REFEREE_REF"
          node .github/scripts/release-attestation.mjs verify-referee \
            --ref="$RELEASE_REFEREE_REF" --target="$TARGET_SHA" \
            --evaluator-digest="$RELEASE_REFEREE_SHA256" \
            --tree-digest="$RELEASE_POLICY_TREE_SHA256" \
            --repository="$GITHUB_REPOSITORY" --target-branch=develop
          git fetch --no-tags origin "$BASE_SHA"
          git fetch --no-tags origin "$TARGET_SHA"
          test "$(git rev-parse FETCH_HEAD)" = "$TARGET_SHA"
          requirements="$(node .github/scripts/release-attestation.mjs requirements \
            --base="$BASE_SHA" --target="$TARGET_SHA")"
          policy_count="$(REQUIREMENTS="$requirements" node -e '
            process.stdout.write(String(JSON.parse(process.env.REQUIREMENTS).filter((row)=>row.kind === "policy").length));
          ')"
          if [[ "$policy_count" = 0 ]]; then
            echo "required=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          REQUIREMENTS="$requirements" BASE_SHA="$BASE_SHA" TARGET_SHA="$TARGET_SHA" node -e '
            const rows=JSON.parse(process.env.REQUIREMENTS);
            const policy=rows.filter((row)=>row.kind === "policy");
            if (rows.length !== 1 || policy.length !== 1 ||
                policy[0].targetSha !== process.env.TARGET_SHA ||
                policy[0].activeBase !== process.env.BASE_SHA ||
                policy[0].protectedBase !== process.env.BASE_SHA ||
                policy[0].evaluatorRef !== process.env.RELEASE_REFEREE_REF ||
                policy[0].evaluatorDigest !== process.env.RELEASE_REFEREE_SHA256 ||
                policy[0].policyTreeDigest !== process.env.RELEASE_POLICY_TREE_SHA256) {
              throw new Error("policy change must be one isolated linear commit under immutable referee");
            }
            require("node:fs").writeFileSync(
              "release-policy-requirement.json",
              JSON.stringify(policy[0], null, 2)+"\n",
              {mode:0o600},
            );
          '
          echo "required=true" >> "$GITHUB_OUTPUT"
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/release-policy.yml" --jq .id)"
          digest="$(REQUIREMENT=release-policy-requirement.json node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.env.REQUIREMENT,"utf8")).digest)')"
          evaluator_digest="$(REQUIREMENT=release-policy-requirement.json node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.env.REQUIREMENT,"utf8")).evaluatorDigest)')"
          tree_digest="$(REQUIREMENT=release-policy-requirement.json node -e 'process.stdout.write(JSON.parse(require("node:fs").readFileSync(process.env.REQUIREMENT,"utf8")).policyTreeDigest)')"
          node .github/scripts/release-attestation.mjs create \
            --kind=policy --target="$TARGET_SHA" --run-head="$BASE_SHA" \
            --active-base="$BASE_SHA" --protected-base="$BASE_SHA" \
            --phase=review --digest="$digest" \
            --evaluator-ref="$RELEASE_REFEREE_REF" --evaluator-digest="$evaluator_digest" \
            --policy-tree-digest="$tree_digest" \
            --workflow-path=.github/workflows/release-policy.yml \
            --workflow-id="$workflow_id" --run-id="$GITHUB_RUN_ID" \
            --run-attempt="$GITHUB_RUN_ATTEMPT" --environment=production-policy \
            --output=release-attestation.json \
            --predicate=release-attestation-predicate.json

      - name: Sign immutable policy attestation
        if: steps.policy.outputs.required == 'true'
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release-attestation.json
          predicate-type: https://zevium.dev/attestations/production-release/v1
          predicate-path: release-attestation-predicate.json

      - name: Upload immutable policy attestation subject
        if: steps.policy.outputs.required == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-attestation-policy-${{ github.event.pull_request.head.sha }}
          path: release-attestation.json
          if-no-files-found: error
          retention-days: 90
