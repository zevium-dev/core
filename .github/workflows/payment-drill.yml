name: Payment Drills

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

concurrency:
  group: payment-drill
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  security:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          architecture: x64
          check-latest: false
          package-manager-cache: false
      - name: Verify dependency bootstrap policy
        run: node scripts/audit-preflight.mjs
      - name: Enable integrity-bound package manager
        run: corepack enable pnpm
      - name: Install dependencies without lifecycle scripts
        run: pnpm --filter . install --frozen-lockfile --ignore-pnpmfile --ignore-scripts --registry=https://registry.npmjs.org/ --config.trust-lockfile=false --config.verify-store-integrity=true
      - name: Verify dependency supply chain
        run: node scripts/audit.mjs

  deterministic-contracts:
    needs: security
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          architecture: x64
          check-latest: false
          package-manager-cache: false
      - name: Verify dependency bootstrap policy
        run: node scripts/audit-preflight.mjs
      - name: Enable integrity-bound package manager
        run: corepack enable pnpm
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-pnpmfile --ignore-scripts --registry=https://registry.npmjs.org/ --config.trust-lockfile=false --config.verify-store-integrity=true
      - name: Run allowlisted dependency lifecycle scripts
        run: pnpm rebuild
      - name: Verify checkout, metering, refunds, and Connect settlement
        run: pnpm exec vitest run --config convex/vitest.config.ts convex/stripe-billing.test.ts convex/stripe-connect.test.ts convex/ingest-usage.test.ts

  real-sandbox-checkout:
    needs: security
    if: github.event_name == 'workflow_dispatch'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    environment: staging
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          architecture: x64
          check-latest: false
          package-manager-cache: false
      - name: Verify dependency bootstrap policy
        run: node scripts/audit-preflight.mjs
      - name: Enable integrity-bound package manager
        run: corepack enable pnpm
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-pnpmfile --ignore-scripts --registry=https://registry.npmjs.org/ --config.trust-lockfile=false --config.verify-store-integrity=true
      - name: Run allowlisted dependency lifecycle scripts
        run: pnpm rebuild
      - name: Install browser runtime
        run: |
          pnpm exec agent-browser install --with-deps
      - name: Run authenticated publish and metered-call journey
        env:
          E2E_BASE_URL: ${{ vars.STAGING_WEB_URL }}
          GATEWAY_URL: ${{ vars.STAGING_GATEWAY_URL }}
          E2E_EMAIL: ${{ secrets.STAGING_E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          E2E_OTP: ${{ secrets.STAGING_E2E_OTP }}
          E2E_API_KEY: ${{ secrets.STAGING_E2E_API_KEY }}
          E2E_ORG_SLUG: ${{ vars.STAGING_E2E_ORG_SLUG }}
        run: e2e/run-all.sh
      - name: Run real Stripe Checkout and refund journey
        env:
          E2E_BASE_URL: ${{ vars.STAGING_WEB_URL }}
          E2E_EMAIL: ${{ secrets.STAGING_E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          E2E_OTP: ${{ secrets.STAGING_E2E_OTP }}
          STRIPE_SECRET_KEY: ${{ secrets.STAGING_STRIPE_SECRET_KEY }}
        run: e2e/04-payment-drill.sh
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: payment-drill-evidence
          path: e2e/artifacts
          if-no-files-found: ignore
