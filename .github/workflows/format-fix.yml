name: Format and Fix

on:
  workflow_dispatch:

env:
  MISE_EXPERIMENTAL: true

jobs:
  format-fix:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Block push to protected refs
        run: |
          branch="${GITHUB_REF#refs/heads/}"
          case "$branch" in
            develop|main|master) echo "Format-fix push to protected branch $branch is forbidden" >&2; exit 1 ;;
            format-fix/*) echo "Format-fix push to format-fix sub-branch is forbidden" >&2; exit 1 ;;
          esac
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          version: 2026.7.13
          install: true
          install_args: node@24.15.0 npm:pnpm@11.8.0 actionlint@1.7.12 gitleaks@8.30.1 shellcheck@0.11.0
      - name: Verify exact Node and pnpm
        run: |
          test "$(node --version)" = "v24.15.0"
          test "$(pnpm --version)" = "11.8.0"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Run format script
        run: pnpm run format
      - name: Create pull request with formatting fixes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add .
          if git diff --staged --quiet; then
            echo "No formatting changes needed"
            exit 0
          fi
          git commit -m "chore: apply formatter fixes"
          format_branch="format-fix/auto-${{ github.run_id }}"
          git checkout -b "$format_branch"
          git push --force origin "$format_branch"
          gh pr create \
            --base "${{ github.ref_name }}" \
            --head "$format_branch" \
            --title "chore: automated formatter fixes" \
            --body "Automated formatting changes applied by the format-fix workflow." \
            --label "format"
