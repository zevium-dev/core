name: Cloudflare Preview Deployment

on:
  workflow_call:
    inputs:
      artifact_name:
        required: false
        type: string
      checkout_sha:
        required: true
        type: string
      component:
        required: true
        type: string
      convex_site_url:
        required: false
        type: string
      convex_url:
        required: false
        type: string
      head_sha:
        required: true
        type: string
      pr_number:
        required: true
        type: number
    outputs:
      deploy_url:
        value: ${{ jobs.deploy.outputs.deploy_url }}

permissions:
  contents: read
  id-token: write

env:
  MISE_EXPERIMENTAL: true
  CLOUDFLARE_ACCOUNT_ID: 1ea9299555b026a6a7484c8323c5a953
  VERSION_TAG: preview-${{ github.run_id }}-${{ github.run_attempt }}
  WRANGLER_SEND_ERROR_REPORTS: false
  WRANGLER_SEND_METRICS: false

jobs:
  deploy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: preview
    outputs:
      deploy_url: ${{ steps.deploy.outputs.deploy_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.checkout_sha }}
          persist-credentials: false
      - name: Download web Worker build
        if: inputs.component == 'web'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: ${{ inputs.artifact_name }}
          path: apps/web/dist
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Deploy isolated Worker through broker
        id: deploy
        env:
          CLERK_PREVIEW_SECRET_KEY: ${{ secrets.CLERK_PREVIEW_SECRET_KEY }}
          CONVEX_SITE_URL: ${{ inputs.convex_site_url }}
          DEPLOY_HEAD_SHA: ${{ inputs.head_sha }}
          GATEWAY_PREVIEW_INTERNAL_SECRET: ${{ secrets.GATEWAY_PREVIEW_INTERNAL_SECRET }}
          PR_NUMBER: ${{ inputs.pr_number }}
          VITE_CONVEX_URL: ${{ inputs.convex_url }}
        run: |
          case "${{ inputs.component }}" in
            gateway)
              worker_name="zevium-gateway-pr-$PR_NUMBER"
              profile="preview-gateway"
              ;;
            web)
              worker_name="zevium-web-pr-$PR_NUMBER"
              profile="preview-web"
              WEB_NAME="$worker_name" node -e '
                const fs = require("node:fs")
                const source = "apps/web/dist/server/wrangler.json"
                const target = "apps/web/dist/server/wrangler.preview.json"
                const config = JSON.parse(fs.readFileSync(source, "utf8"))
                config.name = process.env.WEB_NAME
                delete config.routes
                fs.writeFileSync(target, JSON.stringify(config))
              '
              ;;
            *)
              echo "Unsupported preview component" >&2
              exit 1
              ;;
          esac

          broker_env="$(mktemp)"
          trap 'rm -f "$broker_env"' EXIT
          BROKER_ENV_FILE="$broker_env" node --experimental-strip-types \
            apps/deploy-broker/scripts/register.ts --profile "$profile"
          set -a
          . "$broker_env"
          set +a

          if [ "${{ inputs.component }}" = "gateway" ]; then
            pnpm --filter gateway exec wrangler versions upload --name "$worker_name" \
              --config wrangler.preview.jsonc \
              --tag "$VERSION_TAG" \
              --var "CONVEX_URL:$VITE_CONVEX_URL" \
              --var "CONVEX_SITE_URL:$CONVEX_SITE_URL"
            pnpm --filter gateway exec wrangler versions deploy --name "$worker_name" \
              --config ../deploy-broker/wrangler-client.jsonc \
              --version-tag "$VERSION_TAG" --yes
            printf '%s' "$CLERK_PREVIEW_SECRET_KEY" | \
              pnpm --filter gateway exec wrangler secret put CLERK_SECRET_KEY \
                --name "$worker_name" --config wrangler.preview.jsonc
            printf '%s' "$GATEWAY_PREVIEW_INTERNAL_SECRET" | \
              pnpm --filter gateway exec wrangler secret put GATEWAY_INTERNAL_SECRET \
                --name "$worker_name" --config wrangler.preview.jsonc
          else
            pnpm --filter web exec wrangler versions upload --name "$worker_name" \
              --config dist/server/wrangler.preview.json --tag "$VERSION_TAG"
            pnpm --filter web exec wrangler versions deploy --name "$worker_name" \
              --config ../deploy-broker/wrangler-client.jsonc \
              --version-tag "$VERSION_TAG" --yes
            printf '%s' "$CLERK_PREVIEW_SECRET_KEY" | \
              pnpm --filter web exec wrangler secret put CLERK_SECRET_KEY \
                --name "$worker_name" --config dist/server/wrangler.preview.json
          fi
          curl --fail --silent --show-error --request POST \
            --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
            --header 'Content-Type: application/json' \
            --data '{"enabled":true,"previews_enabled":true}' \
            "$CLOUDFLARE_API_BASE_URL/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker_name/subdomain" \
            >/dev/null
          echo "deploy_url=https://${worker_name}.zevium-dev.workers.dev" >> "$GITHUB_OUTPUT"
