name: Contract Production Schema

on:
  workflow_dispatch:
    inputs:
      release_sha:
        description: Current develop SHA containing reviewed contract or recovery fix
        required: true
        type: string
      contract_sha:
        description: Exact protected contract commit when coalesced under later develop commits
        required: false
        type: string
      expected_active_release:
        description: Exact gateway/web release active before contraction
        required: true
        type: string
      recovery_of:
        description: Exact failed contract commit; empty for normal contraction
        required: false
        type: string

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  actions: read
  contents: read

env:
  PRODUCTION_CONVEX_URL: https://polite-ermine-809.convex.cloud
  PRODUCTION_CONVEX_SITE_URL: https://polite-ermine-809.convex.site
  PRODUCTION_WEB_URL: https://www.zevium.dev
  PRODUCTION_GATEWAY_URL: https://gateway.zevium.dev

jobs:
  resolve:
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    outputs:
      run_head: ${{ steps.guard.outputs.release }}
      target: ${{ steps.contract.outputs.target }}
      active_release: ${{ steps.contract.outputs.active_release }}
      protected_base: ${{ steps.contract.outputs.protected_base }}
      digest: ${{ steps.contract.outputs.digest }}
      recovery_of: ${{ steps.contract.outputs.recovery_of }}
      deploy_sha: ${{ steps.contract.outputs.deploy_sha }}
    steps:
      - name: Candidate-independent stale and CI guard
        id: guard
        env:
          INPUT_RELEASE_SHA: ${{ inputs.release_sha }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$INPUT_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)" = "$INPUT_RELEASE_SHA"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$INPUT_RELEASE_SHA" -f status=completed -f per_page=100 \
            --jq '.workflow_runs | map(select(.path == ".github/workflows/ci.yml" and .event == "push" and .conclusion == "success")) | length == 1' \
            | grep -qx true
          echo "release=$INPUT_RELEASE_SHA" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.guard.outputs.release }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24.15.0
      - name: Install pinned pnpm dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate
          pnpm install --frozen-lockfile

      - name: Resolve exact contract commit and canonical digest
        id: contract
        env:
          RUN_HEAD: ${{ steps.guard.outputs.release }}
          CONTRACT_SHA: ${{ inputs.contract_sha }}
          ACTIVE_RELEASE: ${{ inputs.expected_active_release }}
          RECOVERY_OF: ${{ inputs.recovery_of }}
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$ACTIVE_RELEASE" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$RUN_HEAD"
          if [[ -z "$RECOVERY_OF" ]]; then
            target="${CONTRACT_SHA:-$RUN_HEAD}"
            [[ "$target" =~ ^[0-9a-f]{40}$ ]]
            test "$(git rev-list --parents -n 1 "$target" | wc -w)" = 2
            protected_base="$(git rev-parse "$target^")"
            git merge-base --is-ancestor "$ACTIVE_RELEASE" "$protected_base"
            git merge-base --is-ancestor "$target" "$RUN_HEAD"
          else
            test -z "$CONTRACT_SHA"
            [[ "$RECOVERY_OF" =~ ^[0-9a-f]{40}$ ]]
            target="$RECOVERY_OF"
            test "$(git rev-list --count "$ACTIVE_RELEASE..$target")" = 1
            test "$(git rev-list --count "$target..$RUN_HEAD")" = 1
            protected_base="$(git rev-parse "$target^")"
            test "$protected_base" = "$ACTIVE_RELEASE"
            git merge-base --is-ancestor "$target" "$RUN_HEAD"
          fi
          if [[ -n "$RECOVERY_OF" ]]; then
            invalid_fix_paths="$(git diff --name-only "$target" "$RUN_HEAD" | awk '$0 !~ /^convex\// { print }')"
            test -z "$invalid_fix_paths"
          fi
          classification="$(node .github/scripts/release-convex-contract.mjs classify \
            --base="$protected_base" --target="$target")"
          digest="$(node .github/scripts/release-attestation.mjs contract-digest \
            --base="$protected_base" --target="$target")"
          requirements="$(node .github/scripts/release-attestation.mjs requirements \
            --base="$ACTIVE_RELEASE" --target="$target")"
          after_requirements="$(node .github/scripts/release-attestation.mjs requirements \
            --base="$target" --target="$RUN_HEAD")"
          CLASSIFICATION="$classification" REQUIREMENTS="$requirements" \
            AFTER="$after_requirements" TARGET="$target" PROTECTED_BASE="$protected_base" \
            ACTIVE_RELEASE="$ACTIVE_RELEASE" DIGEST="$digest" RECOVERY_OF="$RECOVERY_OF" node -e '
              const classification=JSON.parse(process.env.CLASSIFICATION);
              const requirements=JSON.parse(process.env.REQUIREMENTS);
              const after=JSON.parse(process.env.AFTER);
              const exact=requirements.filter((row) => row.kind === "contract" &&
                row.targetSha === process.env.TARGET && row.protectedBase === process.env.PROTECTED_BASE &&
                row.activeBase === process.env.ACTIVE_RELEASE && row.phase === "contract" &&
                row.digest === process.env.DIGEST);
              if (classification.baseSha !== process.env.PROTECTED_BASE ||
                  classification.candidateSha !== process.env.TARGET ||
                  !classification.hasChange || !classification.hasContraction ||
                  exact.length !== 1 || requirements.at(-1) !== exact[0] ||
                  (process.env.RECOVERY_OF !== "" && after.length !== 0)) {
                throw new Error("exact semantic contraction is not final protected requirement through target");
              }
            '
          node .github/scripts/release-attestation.mjs verify-remote \
            --base="$ACTIVE_RELEASE" --target="$protected_base"
          deploy_sha="$target"
          if [[ -n "$RECOVERY_OF" ]]; then
            deploy_sha="$RUN_HEAD"
          fi
          {
            echo "target=$target"
            echo "deploy_sha=$deploy_sha"
            echo "active_release=$ACTIVE_RELEASE"
            echo "protected_base=$protected_base"
            echo "digest=$digest"
            echo "recovery_of=$RECOVERY_OF"
          } >> "$GITHUB_OUTPUT"
          rm -rf .turbo apps/web/.turbo apps/gateway/.turbo packages/shared/.turbo
          pnpm ci:pr

  staging:
    needs: resolve
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 35
    environment: staging
    env:
      RUN_HEAD: ${{ needs.resolve.outputs.run_head }}
      TARGET_SHA: ${{ needs.resolve.outputs.target }}
      DEPLOY_SHA: ${{ needs.resolve.outputs.deploy_sha }}
      ACTIVE_RELEASE: ${{ needs.resolve.outputs.active_release }}
      PROTECTED_BASE: ${{ needs.resolve.outputs.protected_base }}
      CONTRACT_DIGEST: ${{ needs.resolve.outputs.digest }}
      STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL }}
      STAGING_GATEWAY_URL: ${{ vars.STAGING_GATEWAY_URL }}
      STAGING_CONVEX_URL: ${{ vars.STAGING_CONVEX_URL }}
      STAGING_CONVEX_SITE_URL: ${{ vars.STAGING_CONVEX_SITE_URL }}
      RELEASE_PROBE_MOCK_PATH: ${{ vars.RELEASE_PROBE_MOCK_PATH }}
      RELEASE_PROBE_MOCK_METHOD: ${{ vars.RELEASE_PROBE_MOCK_METHOD }}
      RELEASE_PROBE_METERED_PATH: ${{ vars.RELEASE_PROBE_METERED_PATH }}
      RELEASE_PROBE_METERED_METHOD: ${{ vars.RELEASE_PROBE_METERED_METHOD }}
      RELEASE_PROBE_CONTENT_TYPE: ${{ vars.RELEASE_PROBE_CONTENT_TYPE }}
      RELEASE_PROBE_CONSUMER_ORG_SLUG: ${{ vars.RELEASE_PROBE_CONSUMER_ORG_SLUG }}
      RELEASE_PROBE_CONSUMER_MEMBER_USER_ID: ${{ vars.RELEASE_PROBE_CONSUMER_MEMBER_USER_ID }}
      RELEASE_PROBE_API_KEY_ID: ${{ vars.RELEASE_PROBE_API_KEY_ID }}
    steps:
      - name: Candidate-independent stale guard before checkout or setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)" = "$RUN_HEAD"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$RUN_HEAD" -f status=completed -f per_page=100 \
            --jq '.workflow_runs | map(select(.path == ".github/workflows/ci.yml" and .event == "push" and .conclusion == "success")) | length == 1' \
            | grep -qx true

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.run_head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.deploy_sha }}
          path: .release-contract-candidate
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24.15.0
      - name: Install pinned pnpm dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate
          pnpm install --frozen-lockfile
          pnpm --dir .release-contract-candidate install --frozen-lockfile

      - name: Prove paid staging baseline with runtime Clerk key
        env:
          CLERK_STAGING_SECRET_KEY: ${{ secrets.CLERK_STAGING_SECRET_KEY }}
          RELEASE_PROBE_REQUEST_BODY: ${{ secrets.STAGING_RELEASE_PROBE_REQUEST_BODY }}
          RELEASE_PROBE_SECRET: ${{ secrets.STAGING_RELEASE_PROBE_SECRET }}
        run: |
          staging_active="$(node .github/scripts/release-contract.mjs --current-release=true \
            --web="$STAGING_WEB_URL" --gateway="$STAGING_GATEWAY_URL")"
          [[ "$staging_active" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$ACTIVE_RELEASE" "$staging_active"
          git merge-base --is-ancestor "$staging_active" "$RUN_HEAD"
          node .github/scripts/with-clerk-release-key.mjs \
            --clerk-secret-env=CLERK_STAGING_SECRET_KEY \
            --org-slug="$RELEASE_PROBE_CONSUMER_ORG_SLUG" \
            --member-user-id="$RELEASE_PROBE_CONSUMER_MEMBER_USER_ID" \
            --key-id="$RELEASE_PROBE_API_KEY_ID" -- \
            node .github/scripts/release-contract.mjs \
              --release="$staging_active" --web="$STAGING_WEB_URL" \
              --gateway="$STAGING_GATEWAY_URL" \
              --mock-path="$RELEASE_PROBE_MOCK_PATH" --mock-method="$RELEASE_PROBE_MOCK_METHOD" \
              --metered-path="$RELEASE_PROBE_METERED_PATH" --metered-method="$RELEASE_PROBE_METERED_METHOD" \
              --content-type="$RELEASE_PROBE_CONTENT_TYPE" \
              --accounting="$STAGING_CONVEX_SITE_URL/release-probe-accounting" \
              --output=release-evidence/staging-pre-contract.json

      - name: Guard exact target immediately before staging contraction
        env:
          GH_TOKEN: ${{ github.token }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_STAGING_DEPLOY_KEY }}
          EXPECTED_CONVEX_URL: ${{ env.STAGING_CONVEX_URL }}
        run: |
          test "$(git rev-parse HEAD)" = "$RUN_HEAD"
          test "$(git -C .release-contract-candidate rev-parse HEAD)" = "$DEPLOY_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)" = "$RUN_HEAD"
          classification="$(node .github/scripts/release-convex-contract.mjs classify \
            --base="$PROTECTED_BASE" --target="$TARGET_SHA")"
          CLASSIFICATION="$classification" node -e '
            const row=JSON.parse(process.env.CLASSIFICATION);
            if (row.baseSha !== process.env.PROTECTED_BASE || row.candidateSha !== process.env.TARGET_SHA ||
                !row.hasContraction) throw new Error("exact staging contraction classification drifted");
          '
          test "$(node .github/scripts/release-attestation.mjs contract-digest \
            --base="$PROTECTED_BASE" --target="$TARGET_SHA")" = "$CONTRACT_DIGEST"
          convex_dry_run="$(cd .release-contract-candidate && pnpm exec convex deploy --dry-run --yes \
            --codegen disable --typecheck disable 2>&1)"
          printf '%s' "$convex_dry_run" \
            | node .github/scripts/release-contract.mjs --validate-convex-dry-run=true
          (cd .release-contract-candidate && \
            pnpm exec convex deploy --yes --message "staging contract $DEPLOY_SHA")

      - name: Prove paid staging contracted state with runtime Clerk key
        env:
          CLERK_STAGING_SECRET_KEY: ${{ secrets.CLERK_STAGING_SECRET_KEY }}
          RELEASE_PROBE_REQUEST_BODY: ${{ secrets.STAGING_RELEASE_PROBE_REQUEST_BODY }}
          RELEASE_PROBE_SECRET: ${{ secrets.STAGING_RELEASE_PROBE_SECRET }}
        run: |
          staging_active="$(node .github/scripts/release-contract.mjs --current-release=true \
            --web="$STAGING_WEB_URL" --gateway="$STAGING_GATEWAY_URL")"
          [[ "$staging_active" =~ ^[0-9a-f]{40}$ ]]
          git merge-base --is-ancestor "$ACTIVE_RELEASE" "$staging_active"
          git merge-base --is-ancestor "$staging_active" "$RUN_HEAD"
          node .github/scripts/with-clerk-release-key.mjs \
            --clerk-secret-env=CLERK_STAGING_SECRET_KEY \
            --org-slug="$RELEASE_PROBE_CONSUMER_ORG_SLUG" \
            --member-user-id="$RELEASE_PROBE_CONSUMER_MEMBER_USER_ID" \
            --key-id="$RELEASE_PROBE_API_KEY_ID" -- \
            node .github/scripts/release-contract.mjs \
              --release="$staging_active" --web="$STAGING_WEB_URL" \
              --gateway="$STAGING_GATEWAY_URL" \
              --mock-path="$RELEASE_PROBE_MOCK_PATH" --mock-method="$RELEASE_PROBE_MOCK_METHOD" \
              --metered-path="$RELEASE_PROBE_METERED_PATH" --metered-method="$RELEASE_PROBE_METERED_METHOD" \
              --content-type="$RELEASE_PROBE_CONTENT_TYPE" \
              --accounting="$STAGING_CONVEX_SITE_URL/release-probe-accounting" \
              --output=release-evidence/staging-post-contract.json

      - name: Upload staging contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: contract-staging-${{ needs.resolve.outputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence
          if-no-files-found: warn
          retention-days: 14

  production:
    needs: [resolve, staging]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: production-contract
    permissions:
      actions: read
      attestations: write
      contents: read
      id-token: write
    env:
      RUN_HEAD: ${{ needs.resolve.outputs.run_head }}
      TARGET_SHA: ${{ needs.resolve.outputs.target }}
      DEPLOY_SHA: ${{ needs.resolve.outputs.deploy_sha }}
      ACTIVE_RELEASE: ${{ needs.resolve.outputs.active_release }}
      PROTECTED_BASE: ${{ needs.resolve.outputs.protected_base }}
      CONTRACT_DIGEST: ${{ needs.resolve.outputs.digest }}
      RECOVERY_OF: ${{ needs.resolve.outputs.recovery_of }}
      RELEASE_PROBE_MOCK_PATH: ${{ vars.RELEASE_PROBE_MOCK_PATH }}
      RELEASE_PROBE_MOCK_METHOD: ${{ vars.RELEASE_PROBE_MOCK_METHOD }}
      RELEASE_PROBE_METERED_PATH: ${{ vars.RELEASE_PROBE_METERED_PATH }}
      RELEASE_PROBE_METERED_METHOD: ${{ vars.RELEASE_PROBE_METERED_METHOD }}
      RELEASE_PROBE_CONTENT_TYPE: ${{ vars.RELEASE_PROBE_CONTENT_TYPE }}
      RELEASE_PROBE_CONSUMER_ORG_SLUG: ${{ vars.RELEASE_PROBE_CONSUMER_ORG_SLUG }}
      RELEASE_PROBE_CONSUMER_MEMBER_USER_ID: ${{ vars.RELEASE_PROBE_CONSUMER_MEMBER_USER_ID }}
      RELEASE_PROBE_API_KEY_ID: ${{ vars.RELEASE_PROBE_API_KEY_ID }}
    steps:
      - name: Candidate-independent stale guard before checkout or setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)" = "$RUN_HEAD"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$RUN_HEAD" -f status=completed -f per_page=100 \
            --jq '.workflow_runs | map(select(.path == ".github/workflows/ci.yml" and .event == "push" and .conclusion == "success")) | length == 1' \
            | grep -qx true

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.run_head }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.resolve.outputs.deploy_sha }}
          path: .release-contract-candidate
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24.15.0
      - name: Install pinned pnpm dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate
          pnpm install --frozen-lockfile
          pnpm --dir .release-contract-candidate install --frozen-lockfile

      - name: Prove production baseline with runtime Clerk key
        env:
          CLERK_PRODUCTION_SECRET_KEY: ${{ secrets.CLERK_PRODUCTION_SECRET_KEY }}
          RELEASE_PROBE_REQUEST_BODY: ${{ secrets.PRODUCTION_RELEASE_PROBE_REQUEST_BODY }}
          RELEASE_PROBE_SECRET: ${{ secrets.PRODUCTION_RELEASE_PROBE_SECRET }}
        run: |
          node .github/scripts/with-clerk-release-key.mjs \
            --clerk-secret-env=CLERK_PRODUCTION_SECRET_KEY \
            --org-slug="$RELEASE_PROBE_CONSUMER_ORG_SLUG" \
            --member-user-id="$RELEASE_PROBE_CONSUMER_MEMBER_USER_ID" \
            --key-id="$RELEASE_PROBE_API_KEY_ID" -- \
            node .github/scripts/release-contract.mjs \
              --release="$ACTIVE_RELEASE" --web="$PRODUCTION_WEB_URL" \
              --gateway="$PRODUCTION_GATEWAY_URL" \
              --mock-path="$RELEASE_PROBE_MOCK_PATH" --mock-method="$RELEASE_PROBE_MOCK_METHOD" \
              --metered-path="$RELEASE_PROBE_METERED_PATH" --metered-method="$RELEASE_PROBE_METERED_METHOD" \
              --content-type="$RELEASE_PROBE_CONTENT_TYPE" \
              --accounting="$PRODUCTION_CONVEX_SITE_URL/release-probe-accounting" \
              --output=release-evidence/pre-contract.json

      - name: Persist forward-recovery manifest before mutation
        run: |
          mkdir -p release-evidence
          RUN_HEAD="$RUN_HEAD" TARGET_SHA="$TARGET_SHA" DEPLOY_SHA="$DEPLOY_SHA" \
            ACTIVE_RELEASE="$ACTIVE_RELEASE" \
            CONTRACT_DIGEST="$CONTRACT_DIGEST" RUN_ID="$GITHUB_RUN_ID" \
            RUN_ATTEMPT="$GITHUB_RUN_ATTEMPT" node -e '
              const fs=require("node:fs");
              const value={schemaVersion:2,runHead:process.env.RUN_HEAD,targetSha:process.env.TARGET_SHA,
                deploySha:process.env.DEPLOY_SHA,
                activeBase:process.env.ACTIVE_RELEASE,protectedBase:process.env.PROTECTED_BASE,digest:process.env.CONTRACT_DIGEST,
                recovery:"roll-forward-only",
                source:{runId:Number(process.env.RUN_ID),runAttempt:Number(process.env.RUN_ATTEMPT),workflowPath:".github/workflows/contract-production.yml"},
                createdAt:new Date().toISOString()};
              fs.writeFileSync("release-evidence/contract-recovery-manifest.json",JSON.stringify(value,null,2)+"\n",{mode:0o600});
            '

      - name: Upload contract recovery manifest before mutation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: contract-recovery-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence/contract-recovery-manifest.json
          if-no-files-found: error
          retention-days: 30

      - name: Guard GitHub identity, active release, and Convex target immediately before contraction
        env:
          GH_TOKEN: ${{ github.token }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PRODUCTION_DEPLOY_KEY }}
          EXPECTED_CONVEX_URL: ${{ env.PRODUCTION_CONVEX_URL }}
        run: |
          record_signal() {
            mkdir -p release-evidence
            SIGNAL="$1" node -e 'require("node:fs").writeFileSync("release-evidence/ambiguous.json",JSON.stringify({state:"ambiguous_recovery_required",signal:process.env.SIGNAL,at:new Date().toISOString()})+"\n",{mode:0o600})' || true
            exit 143
          }
          trap 'record_signal SIGINT' INT
          trap 'record_signal SIGTERM' TERM
          test "$(git rev-parse HEAD)" = "$RUN_HEAD"
          test "$(git -C .release-contract-candidate rev-parse HEAD)" = "$DEPLOY_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)" = "$RUN_HEAD"
          test "$(node .github/scripts/release-contract.mjs --current-release=true \
            --web="$PRODUCTION_WEB_URL" --gateway="$PRODUCTION_GATEWAY_URL")" = "$ACTIVE_RELEASE"
          classification="$(node .github/scripts/release-convex-contract.mjs classify \
            --base="$PROTECTED_BASE" --target="$TARGET_SHA")"
          CLASSIFICATION="$classification" node -e '
            const row=JSON.parse(process.env.CLASSIFICATION);
            if (row.baseSha !== process.env.PROTECTED_BASE || row.candidateSha !== process.env.TARGET_SHA ||
                !row.hasContraction) throw new Error("exact production contraction classification drifted");
          '
          test "$(node .github/scripts/release-attestation.mjs contract-digest \
            --base="$PROTECTED_BASE" --target="$TARGET_SHA")" = "$CONTRACT_DIGEST"
          convex_dry_run="$(cd .release-contract-candidate && pnpm exec convex deploy --dry-run --yes \
            --codegen disable --typecheck disable 2>&1)"
          printf '%s' "$convex_dry_run" \
            | node .github/scripts/release-contract.mjs --validate-convex-dry-run=true
          (cd .release-contract-candidate && \
            pnpm exec convex deploy --yes --message "production contract $DEPLOY_SHA")

      - name: Prove production contracted accounting with runtime Clerk key
        env:
          CLERK_PRODUCTION_SECRET_KEY: ${{ secrets.CLERK_PRODUCTION_SECRET_KEY }}
          RELEASE_PROBE_REQUEST_BODY: ${{ secrets.PRODUCTION_RELEASE_PROBE_REQUEST_BODY }}
          RELEASE_PROBE_SECRET: ${{ secrets.PRODUCTION_RELEASE_PROBE_SECRET }}
        run: |
          node .github/scripts/with-clerk-release-key.mjs \
            --clerk-secret-env=CLERK_PRODUCTION_SECRET_KEY \
            --org-slug="$RELEASE_PROBE_CONSUMER_ORG_SLUG" \
            --member-user-id="$RELEASE_PROBE_CONSUMER_MEMBER_USER_ID" \
            --key-id="$RELEASE_PROBE_API_KEY_ID" -- \
            node .github/scripts/release-contract.mjs \
              --release="$ACTIVE_RELEASE" --web="$PRODUCTION_WEB_URL" \
              --gateway="$PRODUCTION_GATEWAY_URL" \
              --mock-path="$RELEASE_PROBE_MOCK_PATH" --mock-method="$RELEASE_PROBE_MOCK_METHOD" \
              --metered-path="$RELEASE_PROBE_METERED_PATH" --metered-method="$RELEASE_PROBE_METERED_METHOD" \
              --content-type="$RELEASE_PROBE_CONTENT_TYPE" \
              --accounting="$PRODUCTION_CONVEX_SITE_URL/release-probe-accounting" \
              --output=release-evidence/post-contract.json

      - name: Build exact protected-workflow attestation subject
        id: attestation
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          workflow_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/contract-production.yml" --jq .id)"
          node .github/scripts/release-attestation.mjs create \
            --kind=contract --target="$TARGET_SHA" --run-head="$RUN_HEAD" \
            --active-base="$ACTIVE_RELEASE" --protected-base="$PROTECTED_BASE" \
            --phase=contract \
            --digest="$CONTRACT_DIGEST" \
            --workflow-path=.github/workflows/contract-production.yml \
            --workflow-id="$workflow_id" --run-id="$GITHUB_RUN_ID" \
            --run-attempt="$GITHUB_RUN_ATTEMPT" --environment=production-contract \
            --recovery-of="$RECOVERY_OF" \
            --output=release-evidence/release-attestation.json \
            --predicate=release-evidence/release-attestation-predicate.json

      - name: Sign protected contract attestation
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release-evidence/release-attestation.json
          predicate-type: https://zevium.dev/attestations/production-release/v1
          predicate-path: release-evidence/release-attestation-predicate.json

      - name: Upload immutable contract attestation subject
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-attestation-contract-${{ needs.resolve.outputs.target }}
          path: release-evidence/release-attestation.json
          if-no-files-found: error
          retention-days: 90

      - name: Record ambiguity after failure or cancellation
        if: failure() || cancelled()
        run: |
          mkdir -p release-evidence
          node -e 'require("node:fs").writeFileSync("release-evidence/ambiguous.json",JSON.stringify({state:"ambiguous_recovery_required",at:new Date().toISOString()})+"\n",{mode:0o600})'

      - name: Upload contract evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: contract-production-${{ needs.resolve.outputs.target }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence
          if-no-files-found: error
          retention-days: 30
