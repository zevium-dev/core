name: Deploy Production

on:
  workflow_run:
    workflows: [Continuous Integration]
    types: [completed]
    branches: [develop]
  workflow_dispatch:
    inputs:
      release_sha:
        description: Current develop SHA with successful CI
        required: true
        type: string

# GitHub keeps one running and newest pending member. Coalescing is intentional:
# only current develop is valid, every superseded valid SHA must be its ancestor,
# and preflight verifies every protected commit in active..newest.
concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  actions: read
  attestations: read
  contents: read
  deployments: read

env:
  RELEASE_REFEREE_REF: ${{ vars.RELEASE_REFEREE_REF }}
  RELEASE_REFEREE_SHA256: ${{ vars.RELEASE_REFEREE_SHA256 }}
  RELEASE_POLICY_TREE_SHA256: ${{ vars.RELEASE_POLICY_TREE_SHA256 }}
  CLOUDFLARE_ACCOUNT_ID: 1ea9299555b026a6a7484c8323c5a953
  PRODUCTION_CONVEX_URL: https://polite-ermine-809.convex.cloud
  PRODUCTION_CONVEX_SITE_URL: https://polite-ermine-809.convex.site
  PRODUCTION_WEB_URL: https://www.zevium.dev
  PRODUCTION_GATEWAY_URL: https://gateway.zevium.dev

jobs:
  preflight:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'develop')
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    outputs:
      eligible: ${{ steps.classify.outputs.eligible }}
      release: ${{ steps.guard.outputs.release }}
      active_release: ${{ steps.active.outputs.release }}
      lifecycle_digest: ${{ steps.classify.outputs.digest }}
    steps:
      - name: Candidate-independent GitHub stale and CI guard
        id: guard
        env:
          EVENT_RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
          INPUT_RELEASE_SHA: ${{ inputs.release_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          GH_TOKEN: ${{ github.token }}
        run: |
          release_sha="${EVENT_RELEASE_SHA:-$INPUT_RELEASE_SHA}"
          [[ "$release_sha" =~ ^[0-9a-f]{40}$ ]] || {
            echo "release SHA must be full lowercase SHA" >&2
            exit 1
          }
          current_develop="$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)"
          test "$current_develop" = "$release_sha" || {
            echo "Superseded release coalesced into newer develop tip" >&2
            exit 1
          }
          if [[ -n "$SOURCE_RUN_ID" ]]; then
            run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          else
            run_json="$(gh api --method GET \
              "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
              -f head_sha="$release_sha" -f status=completed -f per_page=100)"
          fi
          RELEASE_SHA="$release_sha" SOURCE_RUN_ID="$SOURCE_RUN_ID" \
            RUN_JSON="$run_json" node -e '
              const payload = JSON.parse(process.env.RUN_JSON);
              const rows = Array.isArray(payload.workflow_runs)
                ? payload.workflow_runs
                : [payload];
              const matches = rows.filter((run) =>
                run.head_sha === process.env.RELEASE_SHA &&
                run.path === ".github/workflows/ci.yml" &&
                run.status === "completed" &&
                run.conclusion === "success" &&
                run.event === "push" &&
                (!process.env.SOURCE_RUN_ID || String(run.id) === process.env.SOURCE_RUN_ID));
              if (matches.length !== 1) throw new Error("exact successful CI run unavailable");
            '
          echo "release=$release_sha" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ steps.guard.outputs.release }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24.15.0
      - name: Install pinned pnpm dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Materialize immutable protected release referee
        env:
          RELEASE_TARGET: ${{ steps.guard.outputs.release }}
        run: |
          [[ "$RELEASE_REFEREE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_REFEREE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_POLICY_TREE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          referee_root="$(mktemp -d "$RUNNER_TEMP/zevium-release-referee.XXXXXX")"
          git archive "$RELEASE_REFEREE_REF" | tar -x -C "$referee_root"
          pnpm --dir "$referee_root" install --frozen-lockfile --ignore-scripts
          referee_dir="$referee_root/.github/scripts"
          node "$referee_dir/release-attestation.mjs" verify-referee \
            --ref="$RELEASE_REFEREE_REF" --target="$RELEASE_TARGET" \
            --evaluator-digest="$RELEASE_REFEREE_SHA256" \
            --tree-digest="$RELEASE_POLICY_TREE_SHA256" \
            --repository="$GITHUB_REPOSITORY" --target-branch=develop
          echo "RELEASE_REFEREE_DIR=$referee_dir" >> "$GITHUB_ENV"

      - name: Resolve exact active production identity
        id: active
        run: |
          test "$(git rev-parse HEAD)" = "${{ steps.guard.outputs.release }}"
          active_release="$(node "$RELEASE_REFEREE_DIR/release-contract.mjs" \
            --current-release=true --web="$PRODUCTION_WEB_URL" \
            --gateway="$PRODUCTION_GATEWAY_URL")"
          [[ "$active_release" =~ ^[0-9a-f]{40}$ ]] || {
            echo "Active production provenance is unavailable; manual bootstrap required" >&2
            exit 1
          }
          git merge-base --is-ancestor "$active_release" "${{ steps.guard.outputs.release }}"
          echo "release=$active_release" >> "$GITHUB_OUTPUT"

      - name: Classify lifecycle secret-free before any staging mutation
        id: classify
        env:
          RELEASE_SHA: ${{ steps.guard.outputs.release }}
          ACTIVE_RELEASE: ${{ steps.active.outputs.release }}
          GH_TOKEN: ${{ github.token }}
        run: |
          active_config="$RUNNER_TEMP/active-wrangler.jsonc"
          git show "$ACTIVE_RELEASE:apps/gateway/wrangler.jsonc" > "$active_config"
          classification="$(node "$RELEASE_REFEREE_DIR/release-lifecycle.mjs" classify \
            --base="$active_config" --candidate=apps/gateway/wrangler.jsonc)"
          invalid="$(CLASSIFICATION="$classification" node -e '
            const row=JSON.parse(process.env.CLASSIFICATION);
            process.stdout.write(String(row.invalid || row.phase === "mixed"));
          ')"
          test "$invalid" = false || {
            echo "Invalid lifecycle diff cannot enter any release workflow" >&2
            exit 1
          }
          has_change="$(CLASSIFICATION="$classification" node -e '
            process.stdout.write(String(JSON.parse(process.env.CLASSIFICATION).hasChange));
          ')"
          digest="$(CLASSIFICATION="$classification" node -e '
            process.stdout.write(JSON.parse(process.env.CLASSIFICATION).digest);
          ')"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          if [[ "$has_change" = true ]]; then
            echo "Durable Object lifecycle diff: generic release skipped; dedicated workflow owns staging and production"
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node "$RELEASE_REFEREE_DIR/release-convex-contract.mjs" classify \
            --base="$ACTIVE_RELEASE" --target="$RELEASE_SHA" \
            > "$RUNNER_TEMP/preflight-convex-classification.json"
          node "$RELEASE_REFEREE_DIR/release-attestation.mjs" verify-remote \
            --base="$ACTIVE_RELEASE" --target="$RELEASE_SHA"
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Re-run complete release contract uncached
        if: steps.classify.outputs.eligible == 'true'
        run: |
          rm -rf .turbo apps/web/.turbo apps/gateway/.turbo packages/shared/.turbo
          pnpm ci:pr

  staging:
    needs: preflight
    if: needs.preflight.outputs.eligible == 'true'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 50
    environment: staging
    env:
      RELEASE_SHA: ${{ needs.preflight.outputs.release }}
      ACTIVE_RELEASE: ${{ needs.preflight.outputs.active_release }}
      STAGING_WEB_URL: ${{ vars.STAGING_WEB_URL }}
      STAGING_GATEWAY_URL: ${{ vars.STAGING_GATEWAY_URL }}
      STAGING_CONVEX_URL: ${{ vars.STAGING_CONVEX_URL }}
      STAGING_CONVEX_SITE_URL: ${{ vars.STAGING_CONVEX_SITE_URL }}
      RELEASE_PROBE_MOCK_PATH: ${{ vars.RELEASE_PROBE_MOCK_PATH }}
      RELEASE_PROBE_MOCK_METHOD: ${{ vars.RELEASE_PROBE_MOCK_METHOD }}
      RELEASE_PROBE_METERED_PATH: ${{ vars.RELEASE_PROBE_METERED_PATH }}
      RELEASE_PROBE_METERED_METHOD: ${{ vars.RELEASE_PROBE_METERED_METHOD }}
      RELEASE_PROBE_CONTENT_TYPE: ${{ vars.RELEASE_PROBE_CONTENT_TYPE }}
      RELEASE_PROBE_CONSUMER_ORG_SLUG: ${{ vars.RELEASE_PROBE_CONSUMER_ORG_SLUG }}
      RELEASE_PROBE_CONSUMER_MEMBER_USER_ID: ${{ vars.RELEASE_PROBE_CONSUMER_MEMBER_USER_ID }}
      RELEASE_PROBE_API_KEY_ID: ${{ vars.RELEASE_PROBE_API_KEY_ID }}
    steps:
      - name: Candidate-independent stale guard before checkout or setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)" = "$RELEASE_SHA"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$RELEASE_SHA" -f status=completed -f per_page=100 \
            --jq '.workflow_runs | map(select(.path == ".github/workflows/ci.yml" and .event == "push" and .conclusion == "success")) | length == 1' \
            | grep -qx true

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.preflight.outputs.release }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24.15.0
      - name: Install pinned pnpm dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Materialize immutable referee and admit complete semantic range
        run: |
          [[ "$RELEASE_REFEREE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_REFEREE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_POLICY_TREE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          referee_root="$(mktemp -d "$RUNNER_TEMP/zevium-release-referee.XXXXXX")"
          git archive "$RELEASE_REFEREE_REF" | tar -x -C "$referee_root"
          pnpm --dir "$referee_root" install --frozen-lockfile --ignore-scripts
          referee_dir="$referee_root/.github/scripts"
          node "$referee_dir/release-attestation.mjs" verify-referee \
            --ref="$RELEASE_REFEREE_REF" --target="$RELEASE_SHA" \
            --evaluator-digest="$RELEASE_REFEREE_SHA256" \
            --tree-digest="$RELEASE_POLICY_TREE_SHA256" \
            --repository="$GITHUB_REPOSITORY" --target-branch=develop
          node "$referee_dir/release-convex-contract.mjs" classify \
            --base="$ACTIVE_RELEASE" --target="$RELEASE_SHA" > "$RUNNER_TEMP/staging-convex-classification.json"
          node "$referee_dir/release-attestation.mjs" verify-remote \
            --base="$ACTIVE_RELEASE" --target="$RELEASE_SHA"
          echo "RELEASE_REFEREE_DIR=$referee_dir" >> "$GITHUB_ENV"

      - name: Build immutable staging web candidate
        env:
          VITE_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_STAGING_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_STAGING_SECRET_KEY }}
        run: pnpm --filter web build

      - name: Guard target and deploy staging Convex
        env:
          GH_TOKEN: ${{ github.token }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_STAGING_DEPLOY_KEY }}
          EXPECTED_CONVEX_URL: ${{ env.STAGING_CONVEX_URL }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)" = "$RELEASE_SHA"
          convex_dry_run="$(pnpm exec convex deploy --dry-run --yes \
            --codegen disable --typecheck disable 2>&1)"
          printf '%s' "$convex_dry_run" \
          | node "$RELEASE_REFEREE_DIR/release-contract.mjs" --validate-convex-dry-run=true
          pnpm exec convex deploy --yes --message "staging release $RELEASE_SHA"

      - name: Guard active metadata and deploy staging gateway
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)" = "$RELEASE_SHA"
          staging_active="$(node "$RELEASE_REFEREE_DIR/release-contract.mjs" \
            --current-release=true --web="$STAGING_WEB_URL" --gateway="$STAGING_GATEWAY_URL")"
          [[ "$staging_active" =~ ^[0-9a-f]{40}$ ]]
          git show "$staging_active:apps/gateway/wrangler.jsonc" > "$RUNNER_TEMP/staging-active.jsonc"
          pnpm --filter gateway exec wrangler deployments list --json > "$RUNNER_TEMP/staging-gateway-deployments.json"
          active_id="$(node "$RELEASE_REFEREE_DIR/release-state.mjs" get-active-version "$RUNNER_TEMP/staging-gateway-deployments.json")"
          pnpm --filter gateway exec wrangler versions view "$active_id" --json > "$RUNNER_TEMP/staging-gateway-active.json"
          node "$RELEASE_REFEREE_DIR/release-lifecycle.mjs" check-generic \
            --base="$RUNNER_TEMP/staging-active.jsonc" \
            --candidate=apps/gateway/wrangler.jsonc \
            --active-version="$RUNNER_TEMP/staging-gateway-active.json" \
            --expected-version="$active_id"
          pnpm --filter gateway exec wrangler deploy --strict \
            --var "ZEVIUM_RELEASE:$RELEASE_SHA" \
            --var "CONVEX_URL:$STAGING_CONVEX_URL" \
            --var "CONVEX_SITE_URL:$STAGING_CONVEX_SITE_URL"

      - name: Guard active version and deploy staging web
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)" = "$RELEASE_SHA"
          pnpm --filter web exec wrangler deployments list \
            --config dist/server/wrangler.json --json > "$RUNNER_TEMP/staging-web-deployments.json"
          active_id="$(node "$RELEASE_REFEREE_DIR/release-state.mjs" get-active-version "$RUNNER_TEMP/staging-web-deployments.json")"
          pnpm --filter web exec wrangler versions view "$active_id" \
            --config dist/server/wrangler.json --json > "$RUNNER_TEMP/staging-web-active.json"
          ACTIVE_ID="$active_id" VERSION_JSON="$RUNNER_TEMP/staging-web-active.json" node -e '
            const row=require(process.env.VERSION_JSON).result ?? require(process.env.VERSION_JSON);
            if ((row.id ?? row.version_id) !== process.env.ACTIVE_ID) throw new Error("web active version metadata mismatch");
          '
          pnpm --filter web exec wrangler deploy \
            --config dist/server/wrangler.json --strict

      - name: Verify staging paid accounting with runtime Clerk key
        env:
          CLERK_STAGING_SECRET_KEY: ${{ secrets.CLERK_STAGING_SECRET_KEY }}
          RELEASE_PROBE_REQUEST_BODY: ${{ secrets.STAGING_RELEASE_PROBE_REQUEST_BODY }}
          RELEASE_PROBE_SECRET: ${{ secrets.STAGING_RELEASE_PROBE_SECRET }}
        run: |
          node "$RELEASE_REFEREE_DIR/with-clerk-release-key.mjs" \
            --clerk-secret-env=CLERK_STAGING_SECRET_KEY \
            --org-slug="$RELEASE_PROBE_CONSUMER_ORG_SLUG" \
            --member-user-id="$RELEASE_PROBE_CONSUMER_MEMBER_USER_ID" \
            --key-id="$RELEASE_PROBE_API_KEY_ID" -- \
             node "$RELEASE_REFEREE_DIR/release-contract.mjs" \
              --release="$RELEASE_SHA" --web="$STAGING_WEB_URL" \
              --gateway="$STAGING_GATEWAY_URL" \
              --mock-path="$RELEASE_PROBE_MOCK_PATH" \
              --mock-method="$RELEASE_PROBE_MOCK_METHOD" \
              --metered-path="$RELEASE_PROBE_METERED_PATH" \
              --metered-method="$RELEASE_PROBE_METERED_METHOD" \
              --content-type="$RELEASE_PROBE_CONTENT_TYPE" \
              --accounting="$STAGING_CONVEX_SITE_URL/release-probe-accounting" \
              --output=release-evidence/staging-contract.json

      - name: Verify immutable runner browser runtime
        env:
          CHROME_EXECUTABLE: ${{ vars.RELEASE_CHROME_EXECUTABLE }}
        run: |
          browser_lock="$(node "$RELEASE_REFEREE_DIR/verify-agent-browser.mjs" \
            --workspace="$GITHUB_WORKSPACE" --chrome="$CHROME_EXECUTABLE")"
          # JavaScript template literals are intentionally protected from shell expansion.
          # shellcheck disable=SC2016
          BROWSER_LOCK="$browser_lock" node -e '
            const row=JSON.parse(process.env.BROWSER_LOCK);
            require("node:fs").appendFileSync(process.env.GITHUB_ENV,
              `AGENT_BROWSER_BIN=${row.cli}\nAGENT_BROWSER_EXECUTABLE_PATH=${row.browserExecutable}\n`);
          '

      - name: Run exact-request staging E2E with runtime Clerk key
        env:
          CLERK_STAGING_SECRET_KEY: ${{ secrets.CLERK_STAGING_SECRET_KEY }}
          E2E_BASE_URL: ${{ env.STAGING_WEB_URL }}
          GATEWAY_URL: ${{ env.STAGING_GATEWAY_URL }}
          E2E_EMAIL: ${{ secrets.STAGING_E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.STAGING_E2E_PASSWORD }}
          E2E_OTP: ${{ secrets.STAGING_E2E_OTP }}
          E2E_ORG_SLUG: ${{ vars.STAGING_E2E_ORG_SLUG }}
        run: |
          node "$RELEASE_REFEREE_DIR/with-clerk-release-key.mjs" \
            --clerk-secret-env=CLERK_STAGING_SECRET_KEY \
            --org-slug="$RELEASE_PROBE_CONSUMER_ORG_SLUG" \
            --member-user-id="$RELEASE_PROBE_CONSUMER_MEMBER_USER_ID" \
            --key-id="$RELEASE_PROBE_API_KEY_ID" --child-env=E2E_API_KEY -- \
            bash e2e/run-all.sh

      - name: Upload staging evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: staging-release-${{ env.RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            release-evidence
            e2e/artifacts
          if-no-files-found: warn
          retention-days: 14

  production:
    needs: [preflight, staging]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 45
    environment: production
    permissions:
      actions: read
      attestations: write
      contents: read
      deployments: read
      id-token: write
    env:
      RELEASE_SHA: ${{ needs.preflight.outputs.release }}
      ACTIVE_RELEASE: ${{ needs.preflight.outputs.active_release }}
      LIFECYCLE_DIGEST: ${{ needs.preflight.outputs.lifecycle_digest }}
      RELEASE_PROBE_MOCK_PATH: ${{ vars.RELEASE_PROBE_MOCK_PATH }}
      RELEASE_PROBE_MOCK_METHOD: ${{ vars.RELEASE_PROBE_MOCK_METHOD }}
      RELEASE_PROBE_METERED_PATH: ${{ vars.RELEASE_PROBE_METERED_PATH }}
      RELEASE_PROBE_METERED_METHOD: ${{ vars.RELEASE_PROBE_METERED_METHOD }}
      RELEASE_PROBE_CONTENT_TYPE: ${{ vars.RELEASE_PROBE_CONTENT_TYPE }}
      RELEASE_PROBE_CONSUMER_ORG_SLUG: ${{ vars.RELEASE_PROBE_CONSUMER_ORG_SLUG }}
      RELEASE_PROBE_CONSUMER_MEMBER_USER_ID: ${{ vars.RELEASE_PROBE_CONSUMER_MEMBER_USER_ID }}
      RELEASE_PROBE_API_KEY_ID: ${{ vars.RELEASE_PROBE_API_KEY_ID }}
    steps:
      - name: Candidate-independent stale guard before checkout or setup
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)" = "$RELEASE_SHA"
          gh api --method GET "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs" \
            -f head_sha="$RELEASE_SHA" -f status=completed -f per_page=100 \
            --jq '.workflow_runs | map(select(.path == ".github/workflows/ci.yml" and .event == "push" and .conclusion == "success")) | length == 1' \
            | grep -qx true

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ needs.preflight.outputs.release }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903
        with:
          node-version: 24.15.0
      - name: Install pinned pnpm dependencies
        run: |
          corepack enable
          corepack prepare pnpm@11.8.0 --activate
          pnpm install --frozen-lockfile --ignore-scripts

      - name: Materialize immutable referee and freeze production admission
        run: |
          [[ "$RELEASE_REFEREE_REF" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_REFEREE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          [[ "$RELEASE_POLICY_TREE_SHA256" =~ ^[0-9a-f]{64}$ ]]
          referee_root="$(mktemp -d "$RUNNER_TEMP/zevium-release-referee.XXXXXX")"
          git archive "$RELEASE_REFEREE_REF" | tar -x -C "$referee_root"
          pnpm --dir "$referee_root" install --frozen-lockfile --ignore-scripts
          referee_dir="$referee_root/.github/scripts"
          node "$referee_dir/release-attestation.mjs" verify-referee \
            --ref="$RELEASE_REFEREE_REF" --target="$RELEASE_SHA" \
            --evaluator-digest="$RELEASE_REFEREE_SHA256" \
            --tree-digest="$RELEASE_POLICY_TREE_SHA256" \
            --repository="$GITHUB_REPOSITORY" --target-branch=develop
          node "$referee_dir/release-convex-contract.mjs" classify \
            --base="$ACTIVE_RELEASE" --target="$RELEASE_SHA" > "$RUNNER_TEMP/production-convex-classification.json"
          node "$referee_dir/release-attestation.mjs" verify-remote \
            --base="$ACTIVE_RELEASE" --target="$RELEASE_SHA"
          echo "RELEASE_REFEREE_DIR=$referee_dir" >> "$GITHUB_ENV"

      - name: Verify protected provenance again after approval
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)" = "$RELEASE_SHA"
          test "$(node "$RELEASE_REFEREE_DIR/release-contract.mjs" --current-release=true \
            --web="$PRODUCTION_WEB_URL" --gateway="$PRODUCTION_GATEWAY_URL")" = "$ACTIVE_RELEASE"
          node "$RELEASE_REFEREE_DIR/release-attestation.mjs" verify-remote \
            --base="$ACTIVE_RELEASE" --target="$RELEASE_SHA"

      - name: Build immutable production web artifact
        env:
          VITE_RELEASE_SHA: ${{ env.RELEASE_SHA }}
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PRODUCTION_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_PRODUCTION_SECRET_KEY }}
        run: pnpm --filter web build

      - name: Capture exact provider rollback pointers and recovery intent
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          mkdir -p release-evidence
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)" = "$RELEASE_SHA"
          test "$(node "$RELEASE_REFEREE_DIR/release-contract.mjs" --current-release=true \
            --web="$PRODUCTION_WEB_URL" --gateway="$PRODUCTION_GATEWAY_URL")" = "$ACTIVE_RELEASE"
          pnpm --filter gateway exec wrangler deployments list --json > release-evidence/gateway-before.json
          pnpm --filter web exec wrangler deployments list \
            --config dist/server/wrangler.json --json > release-evidence/web-before.json
          node "$RELEASE_REFEREE_DIR/release-state.mjs" capture release-evidence
          gateway_previous="$(node "$RELEASE_REFEREE_DIR/release-state.mjs" get release-evidence gateway)"
          pnpm --filter gateway exec wrangler versions view "$gateway_previous" --json \
            > "$RUNNER_TEMP/production-gateway-active.json"
          git show "$ACTIVE_RELEASE:apps/gateway/wrangler.jsonc" > "$RUNNER_TEMP/production-active.jsonc"
          node "$RELEASE_REFEREE_DIR/release-lifecycle.mjs" check-generic \
            --base="$RUNNER_TEMP/production-active.jsonc" \
            --candidate=apps/gateway/wrangler.jsonc \
            --active-version="$RUNNER_TEMP/production-gateway-active.json" \
            --expected-version="$gateway_previous"
          node "$RELEASE_REFEREE_DIR/release-state.mjs" intent release-evidence \
            "$RELEASE_SHA" "$ACTIVE_RELEASE" "$LIFECYCLE_DIGEST" none true \
            "$GITHUB_RUN_ID" .github/workflows/deploy-production.yml "$GITHUB_RUN_ATTEMPT"
          lineage_token="$(node "$RELEASE_REFEREE_DIR/release-state.mjs" get-lineage-token release-evidence)"
          echo "RECOVERY_LINEAGE_TOKEN=$lineage_token" >> "$GITHUB_ENV"

      - name: Build content-addressed initial recovery lineage subject
        id: initial_lineage
        run: |
          digest="$(node "$RELEASE_REFEREE_DIR/release-state.mjs" lineage-predicate \
            release-evidence release-evidence/recovery-lineage-predicate.json \
            release-evidence/recovery-lineage-subject.json)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Persist initial recovery lineage in immutable attestation store
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release-evidence/recovery-lineage-subject.json
          predicate-type: https://zevium.dev/attestations/recovery-lineage/v1
          predicate-path: release-evidence/recovery-lineage-predicate.json

      - name: Persist recovery manifest before first provider mutation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovery-manifest-initial-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.initial_lineage.outputs.digest }}
          path: |
            release-evidence/recovery-manifest.json
            release-evidence/state.json
          if-no-files-found: error
          retention-days: 30

      - name: Guard identity and active config immediately before gateway upload
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)" = "$RELEASE_SHA"
          test "$(node "$RELEASE_REFEREE_DIR/release-contract.mjs" --current-release=true \
            --web="$PRODUCTION_WEB_URL" --gateway="$PRODUCTION_GATEWAY_URL")" = "$ACTIVE_RELEASE"
          pnpm --filter gateway exec wrangler deployments list --json > "$RUNNER_TEMP/gateway-recaptured.json"
          current_id="$(node "$RELEASE_REFEREE_DIR/release-state.mjs" get-active-version "$RUNNER_TEMP/gateway-recaptured.json")"
          test "$current_id" = "$(node "$RELEASE_REFEREE_DIR/release-state.mjs" get release-evidence gateway)"
          pnpm --filter gateway exec wrangler versions view "$current_id" --json > "$RUNNER_TEMP/gateway-recaptured-version.json"
          node "$RELEASE_REFEREE_DIR/release-lifecycle.mjs" verify-remote \
            --candidate="$RUNNER_TEMP/production-active.jsonc" \
            --active-version="$RUNNER_TEMP/gateway-recaptured-version.json" \
            --expected-version="$current_id"
          WRANGLER_OUTPUT_FILE=release-evidence/gateway-upload.ndjson \
            pnpm --filter gateway exec wrangler versions upload --strict \
              --tag "$RECOVERY_LINEAGE_TOKEN" --var "ZEVIUM_RELEASE:$RELEASE_SHA" \
              --var "CONVEX_URL:$PRODUCTION_CONVEX_URL" \
              --var "CONVEX_SITE_URL:$PRODUCTION_CONVEX_SITE_URL"

      - name: Guard identity and active version immediately before web upload
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)" = "$RELEASE_SHA"
          test "$(node "$RELEASE_REFEREE_DIR/release-contract.mjs" --current-release=true \
            --web="$PRODUCTION_WEB_URL" --gateway="$PRODUCTION_GATEWAY_URL")" = "$ACTIVE_RELEASE"
          pnpm --filter web exec wrangler deployments list \
            --config dist/server/wrangler.json --json > "$RUNNER_TEMP/web-recaptured.json"
          current_id="$(node "$RELEASE_REFEREE_DIR/release-state.mjs" get-active-version "$RUNNER_TEMP/web-recaptured.json")"
          test "$current_id" = "$(node "$RELEASE_REFEREE_DIR/release-state.mjs" get release-evidence web)"
          pnpm --filter web exec wrangler versions view "$current_id" \
            --config dist/server/wrangler.json --json > "$RUNNER_TEMP/web-recaptured-version.json"
          ACTIVE_ID="$current_id" VERSION_JSON="$RUNNER_TEMP/web-recaptured-version.json" node -e '
            const row=require(process.env.VERSION_JSON).result ?? require(process.env.VERSION_JSON);
            if ((row.id ?? row.version_id) !== process.env.ACTIVE_ID) throw new Error("web active metadata mismatch");
          '
          WRANGLER_OUTPUT_FILE=release-evidence/web-upload.ndjson \
            pnpm --filter web exec wrangler versions upload \
              --config dist/server/wrangler.json --strict --tag "$RECOVERY_LINEAGE_TOKEN"

      - name: Finalize bounded recovery manifest
        run: |
          node "$RELEASE_REFEREE_DIR/release-state.mjs" uploaded release-evidence
          node "$RELEASE_REFEREE_DIR/release-state.mjs" manifest release-evidence \
            "$RELEASE_SHA" "$ACTIVE_RELEASE" "$LIFECYCLE_DIGEST" none true \
            "$GITHUB_RUN_ID" .github/workflows/deploy-production.yml "$GITHUB_RUN_ATTEMPT"

      - name: Build content-addressed final recovery lineage subject
        id: final_lineage
        run: |
          digest="$(node "$RELEASE_REFEREE_DIR/release-state.mjs" lineage-predicate \
            release-evidence release-evidence/recovery-lineage-predicate.json \
            release-evidence/recovery-lineage-subject.json)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Persist final recovery lineage in immutable attestation store
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release-evidence/recovery-lineage-subject.json
          predicate-type: https://zevium.dev/attestations/recovery-lineage/v1
          predicate-path: release-evidence/recovery-lineage-predicate.json

      - name: Persist enriched recovery manifest before control-plane or traffic mutation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovery-manifest-final-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.final_lineage.outputs.digest }}
          path: |
            release-evidence/recovery-manifest.json
            release-evidence/state.json
          if-no-files-found: error
          retention-days: 30

      - name: Commit roll-forward-only state before irreversible mutation
        run: node "$RELEASE_REFEREE_DIR/release-state.mjs" mark release-evidence convex_mutation_started

      - name: Build content-addressed irreversible-mutation checkpoint
        id: mutation_lineage
        run: |
          digest="$(node "$RELEASE_REFEREE_DIR/release-state.mjs" lineage-predicate \
            release-evidence release-evidence/recovery-lineage-predicate.json \
            release-evidence/recovery-lineage-subject.json)"
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Persist irreversible-mutation checkpoint in immutable attestation store
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6
        with:
          subject-path: release-evidence/recovery-lineage-subject.json
          predicate-type: https://zevium.dev/attestations/recovery-lineage/v1
          predicate-path: release-evidence/recovery-lineage-predicate.json

      - name: Persist irreversible-mutation checkpoint before provider mutation
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: recovery-manifest-mutation-${{ github.run_id }}-${{ github.run_attempt }}-${{ steps.mutation_lineage.outputs.digest }}
          path: |
            release-evidence/recovery-manifest.json
            release-evidence/state.json
          if-no-files-found: error
          retention-days: 30

      - name: Guard target and deploy compatible Convex expansion
        env:
          GH_TOKEN: ${{ github.token }}
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PRODUCTION_DEPLOY_KEY }}
          EXPECTED_CONVEX_URL: ${{ env.PRODUCTION_CONVEX_URL }}
        run: |
          record_signal() { node "$RELEASE_REFEREE_DIR/release-state.mjs" ambiguous release-evidence "$1" || true; exit 143; }
          trap 'record_signal SIGINT' INT
          trap 'record_signal SIGTERM' TERM
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)" = "$RELEASE_SHA"
          test "$(node "$RELEASE_REFEREE_DIR/release-contract.mjs" --current-release=true \
            --web="$PRODUCTION_WEB_URL" --gateway="$PRODUCTION_GATEWAY_URL")" = "$ACTIVE_RELEASE"
          convex_dry_run="$(pnpm exec convex deploy --dry-run --yes \
            --codegen disable --typecheck disable 2>&1)"
          printf '%s' "$convex_dry_run" \
             | node "$RELEASE_REFEREE_DIR/release-contract.mjs" --validate-convex-dry-run=true
          pnpm exec convex deploy --yes --message "production expansion $RELEASE_SHA"
          node "$RELEASE_REFEREE_DIR/release-state.mjs" mark release-evidence convex_expanded

      - name: Guard versions immediately before zero-traffic gateway deployment
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          record_signal() { node "$RELEASE_REFEREE_DIR/release-state.mjs" ambiguous release-evidence "$1" || true; exit 143; }
          trap 'record_signal SIGINT' INT
          trap 'record_signal SIGTERM' TERM
          gateway_previous="$(node "$RELEASE_REFEREE_DIR/release-state.mjs" get release-evidence gateway previous)"
          gateway_candidate="$(node "$RELEASE_REFEREE_DIR/release-state.mjs" get release-evidence gateway candidate)"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)" = "$RELEASE_SHA"
          test "$(node "$RELEASE_REFEREE_DIR/release-contract.mjs" --current-release=true \
            --web="$PRODUCTION_WEB_URL" --gateway="$PRODUCTION_GATEWAY_URL")" = "$ACTIVE_RELEASE"
          pnpm --filter gateway exec wrangler deployments list --json > "$RUNNER_TEMP/gateway-before-zero.json"
          test "$(node "$RELEASE_REFEREE_DIR/release-state.mjs" get-active-version "$RUNNER_TEMP/gateway-before-zero.json")" = "$gateway_previous"
          pnpm --filter gateway exec wrangler versions view "$gateway_candidate" --json > "$RUNNER_TEMP/gateway-candidate.json"
          node "$RELEASE_REFEREE_DIR/release-lifecycle.mjs" verify-remote \
            --candidate=apps/gateway/wrangler.jsonc \
            --active-version="$RUNNER_TEMP/gateway-candidate.json" \
            --expected-version="$gateway_candidate"
          pnpm --filter gateway exec wrangler versions deploy \
            "$gateway_previous@100%" "$gateway_candidate@0%" --yes

      - name: Paid-probe exact zero-traffic gateway candidate
        env:
          CLERK_PRODUCTION_SECRET_KEY: ${{ secrets.CLERK_PRODUCTION_SECRET_KEY }}
          RELEASE_PROBE_REQUEST_BODY: ${{ secrets.PRODUCTION_RELEASE_PROBE_REQUEST_BODY }}
          RELEASE_PROBE_SECRET: ${{ secrets.PRODUCTION_RELEASE_PROBE_SECRET }}
        run: |
          gateway_candidate="$(node "$RELEASE_REFEREE_DIR/release-state.mjs" get release-evidence gateway candidate)"
          node "$RELEASE_REFEREE_DIR/with-clerk-release-key.mjs" \
            --clerk-secret-env=CLERK_PRODUCTION_SECRET_KEY \
            --org-slug="$RELEASE_PROBE_CONSUMER_ORG_SLUG" \
            --member-user-id="$RELEASE_PROBE_CONSUMER_MEMBER_USER_ID" \
            --key-id="$RELEASE_PROBE_API_KEY_ID" -- \
             node "$RELEASE_REFEREE_DIR/release-contract.mjs" \
              --gateway-only=true --release="$RELEASE_SHA" \
              --gateway="$PRODUCTION_GATEWAY_URL" \
              --gateway-override-name=zevium-gateway \
              --gateway-override-version="$gateway_candidate" \
              --mock-path="$RELEASE_PROBE_MOCK_PATH" \
              --mock-method="$RELEASE_PROBE_MOCK_METHOD" \
              --metered-path="$RELEASE_PROBE_METERED_PATH" \
              --metered-method="$RELEASE_PROBE_METERED_METHOD" \
              --content-type="$RELEASE_PROBE_CONTENT_TYPE" \
              --accounting="$PRODUCTION_CONVEX_SITE_URL/release-probe-accounting" \
              --output=release-evidence/gateway-candidate-contract.json

      - name: Recheck exact weights immediately before gateway traffic mutation
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          record_signal() { node "$RELEASE_REFEREE_DIR/release-state.mjs" ambiguous release-evidence "$1" || true; exit 143; }
          trap 'record_signal SIGINT' INT
          trap 'record_signal SIGTERM' TERM
          gateway_previous="$(node "$RELEASE_REFEREE_DIR/release-state.mjs" get release-evidence gateway previous)"
          gateway_candidate="$(node "$RELEASE_REFEREE_DIR/release-state.mjs" get release-evidence gateway candidate)"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)" = "$RELEASE_SHA"
          pnpm --filter gateway exec wrangler deployments list --json > "$RUNNER_TEMP/gateway-zero.json"
          EXPECTED_PREVIOUS="$gateway_previous" EXPECTED_CANDIDATE="$gateway_candidate" \
            DEPLOYMENTS="$RUNNER_TEMP/gateway-zero.json" node "$RELEASE_REFEREE_DIR/release-state.mjs" verify-zero-traffic
          pnpm --filter gateway exec wrangler versions view "$gateway_candidate" --json > "$RUNNER_TEMP/gateway-before-full.json"
          node "$RELEASE_REFEREE_DIR/release-lifecycle.mjs" verify-remote \
            --candidate=apps/gateway/wrangler.jsonc \
            --active-version="$RUNNER_TEMP/gateway-before-full.json" \
            --expected-version="$gateway_candidate"
          pnpm --filter gateway exec wrangler versions deploy "$gateway_candidate" --yes
          pnpm --filter gateway exec wrangler deployments list --json > "$RUNNER_TEMP/gateway-after-full.json"
          test "$(node "$RELEASE_REFEREE_DIR/release-state.mjs" get-active-version "$RUNNER_TEMP/gateway-after-full.json")" = "$gateway_candidate"
          node "$RELEASE_REFEREE_DIR/release-state.mjs" mark release-evidence gateway_active

      - name: Guard versions immediately before web traffic mutations
        env:
          GH_TOKEN: ${{ github.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          record_signal() { node "$RELEASE_REFEREE_DIR/release-state.mjs" ambiguous release-evidence "$1" || true; exit 143; }
          trap 'record_signal SIGINT' INT
          trap 'record_signal SIGTERM' TERM
          web_previous="$(node "$RELEASE_REFEREE_DIR/release-state.mjs" get release-evidence web previous)"
          web_candidate="$(node "$RELEASE_REFEREE_DIR/release-state.mjs" get release-evidence web candidate)"
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)" = "$RELEASE_SHA"
          pnpm --filter web exec wrangler deployments list \
            --config dist/server/wrangler.json --json > "$RUNNER_TEMP/web-before-zero.json"
          test "$(node "$RELEASE_REFEREE_DIR/release-state.mjs" get-active-version "$RUNNER_TEMP/web-before-zero.json")" = "$web_previous"
          pnpm --filter web exec wrangler versions view "$web_candidate" \
            --config dist/server/wrangler.json --json > "$RUNNER_TEMP/web-candidate.json"
          ACTIVE_ID="$web_candidate" VERSION_JSON="$RUNNER_TEMP/web-candidate.json" node -e '
            const row=require(process.env.VERSION_JSON).result ?? require(process.env.VERSION_JSON);
            if ((row.id ?? row.version_id) !== process.env.ACTIVE_ID) throw new Error("web candidate metadata mismatch");
          '
          pnpm --filter web exec wrangler versions deploy \
            --config dist/server/wrangler.json \
            "$web_previous@100%" "$web_candidate@0%" --yes
          pnpm --filter web exec wrangler deployments list \
            --config dist/server/wrangler.json --json > "$RUNNER_TEMP/web-zero.json"
          EXPECTED_PREVIOUS="$web_previous" EXPECTED_CANDIDATE="$web_candidate" \
            DEPLOYMENTS="$RUNNER_TEMP/web-zero.json" node "$RELEASE_REFEREE_DIR/release-state.mjs" verify-zero-traffic
          pnpm --filter web exec wrangler versions view "$web_candidate" \
            --config dist/server/wrangler.json --json > "$RUNNER_TEMP/web-before-full.json"
          ACTIVE_ID="$web_candidate" VERSION_JSON="$RUNNER_TEMP/web-before-full.json" node -e '
            const row=require(process.env.VERSION_JSON).result ?? require(process.env.VERSION_JSON);
            if ((row.id ?? row.version_id) !== process.env.ACTIVE_ID) throw new Error("web candidate metadata mismatch");
          '
          test "$(gh api "repos/$GITHUB_REPOSITORY/commits/develop" --jq .sha)" = "$RELEASE_SHA"
          pnpm --filter web exec wrangler versions deploy \
            --config dist/server/wrangler.json "$web_candidate" --yes
          pnpm --filter web exec wrangler deployments list \
            --config dist/server/wrangler.json --json > "$RUNNER_TEMP/web-after-full.json"
          test "$(node "$RELEASE_REFEREE_DIR/release-state.mjs" get-active-version "$RUNNER_TEMP/web-after-full.json")" = "$web_candidate"
          node "$RELEASE_REFEREE_DIR/release-state.mjs" mark release-evidence web_active

      - name: Prove final production paid accounting with runtime Clerk key
        env:
          CLERK_PRODUCTION_SECRET_KEY: ${{ secrets.CLERK_PRODUCTION_SECRET_KEY }}
          RELEASE_PROBE_REQUEST_BODY: ${{ secrets.PRODUCTION_RELEASE_PROBE_REQUEST_BODY }}
          RELEASE_PROBE_SECRET: ${{ secrets.PRODUCTION_RELEASE_PROBE_SECRET }}
        run: |
          node "$RELEASE_REFEREE_DIR/with-clerk-release-key.mjs" \
            --clerk-secret-env=CLERK_PRODUCTION_SECRET_KEY \
            --org-slug="$RELEASE_PROBE_CONSUMER_ORG_SLUG" \
            --member-user-id="$RELEASE_PROBE_CONSUMER_MEMBER_USER_ID" \
            --key-id="$RELEASE_PROBE_API_KEY_ID" -- \
             node "$RELEASE_REFEREE_DIR/release-contract.mjs" \
              --release="$RELEASE_SHA" --web="$PRODUCTION_WEB_URL" \
              --gateway="$PRODUCTION_GATEWAY_URL" \
              --mock-path="$RELEASE_PROBE_MOCK_PATH" \
              --mock-method="$RELEASE_PROBE_MOCK_METHOD" \
              --metered-path="$RELEASE_PROBE_METERED_PATH" \
              --metered-method="$RELEASE_PROBE_METERED_METHOD" \
              --content-type="$RELEASE_PROBE_CONTENT_TYPE" \
              --accounting="$PRODUCTION_CONVEX_SITE_URL/release-probe-accounting" \
              --output=release-evidence/production-contract.json

      - name: Record ambiguous state for failed or cancelled release
        if: failure() || cancelled()
        run: node "$RELEASE_REFEREE_DIR/release-state.mjs" ambiguous release-evidence "${{ job.status }}"

      - name: Record verified final state
        if: success()
        env:
          RELEASE_JOB_STATUS: success
        run: |
          node "$RELEASE_REFEREE_DIR/release-state.mjs" final release-evidence \
            "$RELEASE_SHA" "$PRODUCTION_WEB_URL" "$PRODUCTION_GATEWAY_URL"

      - name: Upload production evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: production-release-${{ env.RELEASE_SHA }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release-evidence
          if-no-files-found: error
          retention-days: 30
