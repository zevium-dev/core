name: Deploy Production

on:
  workflow_run:
    workflows: [Continuous Integration]
    types: [completed]
    branches: [develop]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  CLOUDFLARE_ACCOUNT_ID: 1ea9299555b026a6a7484c8323c5a953
  VITE_CONVEX_URL: https://polite-ermine-809.convex.cloud
  VITE_GATEWAY_URL: https://gateway.zevium.dev
  VERSION_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          architecture: x64
          check-latest: false
          package-manager-cache: false
      - name: Verify dependency bootstrap policy
        run: node scripts/audit-preflight.mjs
      - name: Enable integrity-bound package manager
        run: corepack enable pnpm
      - name: Install dependencies without lifecycle scripts
        run: pnpm --filter . install --frozen-lockfile --ignore-pnpmfile --ignore-scripts --registry=https://registry.npmjs.org/ --config.trust-lockfile=false --config.verify-store-integrity=true
      - name: Verify dependency supply chain
        run: node scripts/audit.mjs
      - name: Install audited workspace without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-pnpmfile --ignore-scripts --registry=https://registry.npmjs.org/ --config.trust-lockfile=false --config.verify-store-integrity=true
      - name: Run allowlisted dependency lifecycle scripts
        run: pnpm rebuild

      - name: Deploy Convex control plane
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PRODUCTION_DEPLOY_KEY }}
        run: pnpm exec convex deploy --yes

      - name: Deploy gateway Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --filter gateway exec wrangler versions upload --tag "$VERSION_TAG"
          pnpm --filter gateway exec wrangler versions deploy --version-tag "$VERSION_TAG" --yes

      - name: Build web Worker
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PRODUCTION_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_PRODUCTION_SECRET_KEY }}
        run: pnpm --filter web build

      - name: Deploy web Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --filter web exec wrangler versions upload --config dist/server/wrangler.json --tag "$VERSION_TAG"
          pnpm --filter web exec wrangler versions deploy --config dist/server/wrangler.json --version-tag "$VERSION_TAG" --yes

      - name: Smoke test production
        run: |
          gateway="$(curl --fail --silent --show-error https://gateway.zevium.dev/health)"
          [[ "$gateway" == *'"ok":true'* ]] || { echo "Gateway health response is invalid" >&2; exit 1; }

          web="$(curl --fail --silent --show-error https://www.zevium.dev/)"
          [[ "$web" == *'One key. Every API. Pay per call.'* ]] || { echo "Landing page did not render" >&2; exit 1; }
