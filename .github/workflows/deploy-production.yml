name: Deploy Production

on:
  workflow_run:
    workflows: [Continuous Integration]
    types: [completed]
    branches: [develop]

permissions:
  actions: read
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  PRODUCTION_CONVEX_URL: https://polite-ermine-809.convex.cloud
  PRODUCTION_GATEWAY_URL: https://gateway.zevium.dev
  PRODUCTION_WEB_URL: https://www.zevium.dev

jobs:
  security:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          version: 2026.7.13
          install: true
          install_args: node@24.15.0 npm:pnpm@11.8.0 actionlint@1.7.12 gitleaks@8.30.1 shellcheck@0.11.0
      - name: Verify exact Node and pnpm
        run: |
          test "$(node --version)" = "v24.15.0"
          test "$(pnpm --version)" = "11.8.0"
      - name: Verify dependency bootstrap policy
        run: node scripts/audit-preflight.mjs
      - name: Install dependencies without lifecycle scripts
        run: pnpm --filter . install --frozen-lockfile --ignore-pnpmfile --ignore-scripts --registry=https://registry.npmjs.org/ --config.trust-lockfile=false --config.verify-store-integrity=true
      - name: Verify dependency supply chain
        run: node scripts/audit.mjs

  deploy:
    needs: security
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: production
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PRODUCTION_DEPLOY_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_PRODUCTION_SECRET_KEY }}
      VITE_BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PRODUCTION_PUBLISHABLE_KEY }}
      VITE_CONVEX_URL: https://polite-ermine-809.convex.cloud
      VITE_GATEWAY_URL: https://gateway.zevium.dev
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          version: 2026.7.13
          install: true
          install_args: node@24.15.0 npm:pnpm@11.8.0 actionlint@1.7.12 gitleaks@8.30.1 shellcheck@0.11.0

      - name: Verify exact Node and pnpm
        run: |
          test "$(node --version)" = "v24.15.0"
          test "$(pnpm --version)" = "11.8.0"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify approved release identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          RUN_JSON="$run_json" node -e '
            const run = JSON.parse(process.env.RUN_JSON);
            if (run.name !== "Continuous Integration" || run.event !== "push" ||
                run.head_branch !== "develop" || run.head_sha !== process.env.RELEASE_SHA ||
                run.status !== "completed" || run.conclusion !== "success") process.exit(1);
          '
          remote="$(git ls-remote origin refs/heads/develop)"
          test "${remote%%[[:space:]]*}" = "$RELEASE_SHA"
          for name in CLOUDFLARE_API_TOKEN CONVEX_DEPLOY_KEY CLERK_SECRET_KEY VITE_CLERK_PUBLISHABLE_KEY; do
            test -n "${!name:-}"
          done

      - name: Build production web
        run: pnpm --filter web build

      - name: Prove Convex target
        run: |
          if ! output="$(pnpm exec convex deploy --dry-run --codegen disable --typecheck disable 2>&1)"; then
            printf '%s\n' "$output" >&2
            exit 1
          fi
          [[ "$output" == *'[dry run]'* ]]
          [[ "$output" == *"$PRODUCTION_CONVEX_URL"* ]]

      - name: Deploy Convex
        run: |
          remote="$(git ls-remote origin refs/heads/develop)"
          test "${remote%%[[:space:]]*}" = "$RELEASE_SHA"
          pnpm exec convex deploy --message "production $RELEASE_SHA"

      - name: Deploy gateway
        run: |
          remote="$(git ls-remote origin refs/heads/develop)"
          test "${remote%%[[:space:]]*}" = "$RELEASE_SHA"
          pnpm --filter @zevium/gateway exec wrangler deploy --strict --keep-vars \
            --tag "production-$RELEASE_SHA" \
            --message "production $RELEASE_SHA" \
            --var "ZEVIUM_RELEASE:$RELEASE_SHA" \
            --var "CONVEX_URL:$PRODUCTION_CONVEX_URL" \
            --var "CONVEX_SITE_URL:https://polite-ermine-809.convex.site"

      - name: Deploy web
        run: |
          remote="$(git ls-remote origin refs/heads/develop)"
          test "${remote%%[[:space:]]*}" = "$RELEASE_SHA"
          pnpm --filter web exec wrangler deploy \
            --config dist/server/wrangler.json --strict --keep-vars \
            --tag "production-$RELEASE_SHA" \
            --message "production $RELEASE_SHA"

      - name: Verify production
        run: |
          mkdir -p deploy-evidence
          wait_for_200() {
            url="$1"
            output="$2"
            for attempt in $(seq 1 30); do
              status="$(curl --location --silent --show-error --output "$output" \
                --connect-timeout 2 --max-time 5 --write-out '%{http_code}' \
                --header 'cache-control: no-cache' "$url" || true)"
              test "$status" = 200 && return 0
              (( attempt == 30 )) || sleep 2
            done
            return 1
          }

          wait_for_200 "$PRODUCTION_GATEWAY_URL/health" deploy-evidence/gateway-health.json
          HEALTH=deploy-evidence/gateway-health.json node -e '
            const health = JSON.parse(require("node:fs").readFileSync(process.env.HEALTH, "utf8"));
            if (health.ok !== true || health.service !== "zevium-gateway" ||
                health.release !== process.env.RELEASE_SHA || health.contract !== 1) process.exit(1);
          '
          wait_for_200 "$PRODUCTION_WEB_URL/?release=$RELEASE_SHA" deploy-evidence/landing.html
          grep --fixed-strings --quiet "name=\"zevium-release\" content=\"$RELEASE_SHA\"" deploy-evidence/landing.html
          wait_for_200 "$PRODUCTION_WEB_URL/catalogue" deploy-evidence/catalogue.html
          grep --fixed-strings --quiet '<title>Catalogue · Zevium</title>' deploy-evidence/catalogue.html
          grep --fixed-strings --quiet 'Public APIs with per-call credits' deploy-evidence/catalogue.html
          if grep --fixed-strings --quiet 'Something went wrong' deploy-evidence/catalogue.html; then exit 1; fi

          status="$(curl --silent --show-error --output deploy-evidence/gateway-404.json \
            --write-out '%{http_code}' "$PRODUCTION_GATEWAY_URL/release-contract-missing")"
          test "$status" = 404
          BODY=deploy-evidence/gateway-404.json node -e '
            const body = JSON.parse(require("node:fs").readFileSync(process.env.BODY, "utf8"));
            if (body.error !== "not found" || Object.keys(body).length !== 1) process.exit(1);
          '

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-${{ env.RELEASE_SHA }}-${{ github.run_attempt }}
          path: deploy-evidence
          if-no-files-found: ignore
          retention-days: 7
