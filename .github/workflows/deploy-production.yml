name: Deploy Production

on:
  workflow_run:
    workflows: [Continuous Integration]
    types: [completed]
    branches: [develop]

permissions:
  actions: read
  contents: read

concurrency:
  group: production-release
  cancel-in-progress: false

env:
  PRODUCTION_CONVEX_URL: ${{ vars.PRODUCTION_CONVEX_URL }}
  PRODUCTION_GATEWAY_URL: ${{ vars.PRODUCTION_GATEWAY_URL }}
  PRODUCTION_WEB_URL: ${{ vars.PRODUCTION_WEB_URL }}

jobs:
  deploy:
    if: >-
      vars.CONVEX_REBUILD_ACTIVATED == 'true' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'develop'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 30
    environment: production
    env:
      RELEASE_SHA: ${{ github.event.workflow_run.head_sha }}
      RELEASE_TAG: production-${{ github.event.workflow_run.head_sha }}-${{ github.run_id }}-${{ github.run_attempt }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PRODUCTION_DEPLOY_KEY }}
      CLERK_SECRET_KEY: ${{ secrets.CLERK_PRODUCTION_SECRET_KEY }}
      VITE_BUILD_SHA: ${{ github.event.workflow_run.head_sha }}
      VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PRODUCTION_PUBLISHABLE_KEY }}
      VITE_CONVEX_URL: ${{ vars.PRODUCTION_CONVEX_URL }}
      VITE_GATEWAY_URL: ${{ vars.PRODUCTION_GATEWAY_URL }}
      REGISTRY_KEY_PROJECTION_HMAC_SECRET: ${{ secrets.PRODUCTION_REGISTRY_KEY_PROJECTION_HMAC_SECRET }}
      UPSTREAM_CREDENTIAL_ENCRYPTION_KEYS: ${{ secrets.PRODUCTION_UPSTREAM_CREDENTIAL_ENCRYPTION_KEYS }}
      NEXT_DEPLOYMENT_ID: ${{ vars.PRODUCTION_DEPLOYMENT_ID }}
      CONVEX_SITE_URL: ${{ vars.PRODUCTION_CONVEX_SITE_URL }}
      NEXT_GATEWAY_URL: ${{ vars.PRODUCTION_GATEWAY_URL }}
      NEXT_APP_ORIGIN: ${{ vars.PRODUCTION_WEB_URL }}
      APP_ORIGIN: ${{ vars.PRODUCTION_WEB_URL }}
      NEXT_SNAPSHOT_KEYS: ${{ secrets.PRODUCTION_NEXT_SNAPSHOT_KEYS }}
      NEXT_ADMISSION_KEYS: ${{ secrets.PRODUCTION_NEXT_ADMISSION_KEYS }}
      NEXT_TRANSPORT_KEYS: ${{ secrets.PRODUCTION_NEXT_TRANSPORT_KEYS }}
      GATEWAY_INTERNAL_SECRET: ${{ secrets.PRODUCTION_GATEWAY_INTERNAL_SECRET }}
      NEXT_WEB_SEARCH_SECRET: ${{ secrets.PRODUCTION_NEXT_WEB_SEARCH_SECRET }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: ./.github/actions/setup

      - name: Verify approved release identity
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          run_json="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$SOURCE_RUN_ID")"
          RUN_JSON="$run_json" node -e '
            const run = JSON.parse(process.env.RUN_JSON);
            if (run.name !== "Continuous Integration" || run.event !== "push" ||
                run.head_branch !== "develop" || run.head_sha !== process.env.RELEASE_SHA ||
                run.status !== "completed" || run.conclusion !== "success") process.exit(1);
          '
          remote="$(git ls-remote origin refs/heads/develop)"
          test "${remote%%[[:space:]]*}" = "$RELEASE_SHA"
          mkdir -p .tmp
          for name in CLOUDFLARE_API_TOKEN CONVEX_DEPLOY_KEY CLERK_SECRET_KEY VITE_CLERK_PUBLISHABLE_KEY NEXT_SNAPSHOT_KEYS NEXT_ADMISSION_KEYS NEXT_TRANSPORT_KEYS GATEWAY_INTERNAL_SECRET NEXT_DEPLOYMENT_ID CONVEX_SITE_URL VITE_CONVEX_URL VITE_GATEWAY_URL NEXT_GATEWAY_URL NEXT_APP_ORIGIN APP_ORIGIN PRODUCTION_WEB_URL REGISTRY_KEY_PROJECTION_HMAC_SECRET UPSTREAM_CREDENTIAL_ENCRYPTION_KEYS; do
            test -n "${!name:-}"
          done
          node --import tsx --input-type=module -e '
            import { readRing } from "@zevium/shared/edge/replication";
            import { encryptSecret } from "./convex/lib/credentialCrypto.ts";
            const keys = new Set();
            for (const name of ["NEXT_SNAPSHOT_KEYS", "NEXT_ADMISSION_KEYS", "NEXT_TRANSPORT_KEYS"]) {
              for (const value of Object.values(readRing(process.env[name]).keys)) {
                if (keys.has(value)) process.exit(1);
                keys.add(value);
              }
            }
            await encryptSecret("configuration probe", { purpose: "upstream-credential", resource: "deployment-preflight", generation: 1 });
            for (const name of ["CONVEX_SITE_URL", "VITE_CONVEX_URL", "VITE_GATEWAY_URL", "APP_ORIGIN"]) {
              const url = new URL(process.env[name]);
              if (url.protocol !== "https:" || url.origin !== process.env[name]) process.exit(1);
            }
            if (process.env.NEXT_GATEWAY_URL !== process.env.VITE_GATEWAY_URL ||
                process.env.NEXT_APP_ORIGIN !== process.env.APP_ORIGIN ||
                process.env.APP_ORIGIN !== process.env.PRODUCTION_WEB_URL) process.exit(1);
            if (process.env.GATEWAY_INTERNAL_SECRET.length < 32 || process.env.REGISTRY_KEY_PROJECTION_HMAC_SECRET.length < 32) process.exit(1);
            if (process.env.VITE_CONVEX_URL.replace(".convex.cloud", ".convex.site") !== process.env.CONVEX_SITE_URL) process.exit(1);
          '

      - name: Verify initial cutover before any runtime changes
        run: node scripts/control-plane/preflight-release.mjs

      - name: Build production web
        run: pnpm --filter web build

      - name: Prove Convex target
        run: |
          if ! output="$(pnpm exec convex deploy --dry-run --codegen disable --typecheck disable 2>&1)"; then
            printf '%s\n' "$output" >&2
            exit 1
          fi
          [[ "$output" == *'[dry run]'* ]]
          [[ "$output" == *"$PRODUCTION_CONVEX_URL"* ]]

      - name: Configure paired runtime
        run: |
          remote="$(git ls-remote origin refs/heads/develop)"
          test "${remote%%[[:space:]]*}" = "$RELEASE_SHA"
          for name in NEXT_DEPLOYMENT_ID NEXT_SNAPSHOT_KEYS NEXT_ADMISSION_KEYS NEXT_TRANSPORT_KEYS GATEWAY_INTERNAL_SECRET REGISTRY_KEY_PROJECTION_HMAC_SECRET UPSTREAM_CREDENTIAL_ENCRYPTION_KEYS NEXT_GATEWAY_URL NEXT_APP_ORIGIN APP_ORIGIN; do
            printf '%s' "${!name}" | pnpm exec convex env set "$name"
          done
          if test -n "$NEXT_WEB_SEARCH_SECRET"; then
            printf '%s' "$NEXT_WEB_SEARCH_SECRET" | pnpm exec convex env set NEXT_WEB_SEARCH_SECRET
          fi
          node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const write = (name, keys) => writeFileSync(".tmp/" + name,
              JSON.stringify(Object.fromEntries(keys.map(k => [k, process.env[k] || ""]))), { mode: 0o600 });
            write("web-secrets.json", ["REGISTRY_KEY_PROJECTION_HMAC_SECRET", "NEXT_WEB_SEARCH_SECRET", "CONVEX_SITE_URL"]);
            write("gateway-secrets.json", ["NEXT_SNAPSHOT_KEYS", "NEXT_ADMISSION_KEYS", "NEXT_TRANSPORT_KEYS", "GATEWAY_INTERNAL_SECRET"]);
          '

      - name: Deploy Convex
        run: |
          remote="$(git ls-remote origin refs/heads/develop)"
          test "${remote%%[[:space:]]*}" = "$RELEASE_SHA"
          pnpm exec convex deploy --message "production $RELEASE_SHA"

      - name: Deploy gateway
        run: |
          remote="$(git ls-remote origin refs/heads/develop)"
          test "${remote%%[[:space:]]*}" = "$RELEASE_SHA"
          pnpm --filter @zevium/gateway exec wrangler versions upload --strict --keep-vars \
            --secrets-file ../../.tmp/gateway-secrets.json \
            --var "NEXT_DEPLOYMENT_ID:$NEXT_DEPLOYMENT_ID" \
            --var "APP_ORIGIN:$APP_ORIGIN" \
            --tag "$RELEASE_TAG" \
            --message "production $RELEASE_SHA" \
            --var "ZEVIUM_RELEASE:$RELEASE_SHA" \
            --var "CONVEX_URL:$PRODUCTION_CONVEX_URL" \
            --var "CONVEX_SITE_URL:${{ vars.PRODUCTION_CONVEX_SITE_URL }}"
          pnpm --filter @zevium/gateway exec wrangler versions deploy \
            --version-tag "$RELEASE_TAG@100%" --yes \
            --message "production $RELEASE_SHA"

      - name: Deploy web
        run: |
          remote="$(git ls-remote origin refs/heads/develop)"
          test "${remote%%[[:space:]]*}" = "$RELEASE_SHA"
          pnpm --filter web exec wrangler versions upload \
            --config dist/server/wrangler.json --strict --keep-vars \
            --secrets-file ../../.tmp/web-secrets.json \
            --tag "$RELEASE_TAG" \
            --message "production $RELEASE_SHA"
          pnpm --filter web exec wrangler versions deploy \
            --config dist/server/wrangler.json \
            --version-tag "$RELEASE_TAG@100%" --yes \
            --message "production $RELEASE_SHA"

      - name: Remove runtime secret file
        if: always()
        run: |
          rm -f .tmp/web-secrets.json .tmp/gateway-secrets.json

      - name: Verify production
        run: |
          mkdir -p deploy-evidence
          wait_for_200() {
            url="$1"
            output="$2"
            expected="${3:-}"
            for attempt in $(seq 1 30); do
              status="$(curl --location --silent --show-error --output "$output" \
                --connect-timeout 2 --max-time 5 --write-out '%{http_code}' \
                --header 'cache-control: no-cache' "$url" || true)"
              if test "$status" = 200 && \
                { test -z "$expected" || grep --fixed-strings --quiet "$expected" "$output"; }; then
                return 0
              fi
              (( attempt == 30 )) || sleep 2
            done
            return 1
          }

          wait_for_200 "$PRODUCTION_GATEWAY_URL/health" deploy-evidence/gateway-health.json \
            "\"release\":\"$RELEASE_SHA\""
          HEALTH=deploy-evidence/gateway-health.json node -e '
            const health = JSON.parse(require("node:fs").readFileSync(process.env.HEALTH, "utf8"));
            if (health.ok !== true || health.service !== "zevium-gateway" ||
                health.release !== process.env.RELEASE_SHA || health.contract !== 2) process.exit(1);
          '
          wait_for_200 "$PRODUCTION_WEB_URL/?release=$RELEASE_SHA" deploy-evidence/landing.html \
            "name=\"zevium-release\" content=\"$RELEASE_SHA\""
          wait_for_200 "$PRODUCTION_WEB_URL/catalogue" deploy-evidence/catalogue.html
          grep --fixed-strings --quiet '<title>Catalogue · Zevium</title>' deploy-evidence/catalogue.html
          grep --fixed-strings --quiet 'id="catalogue-search"' deploy-evidence/catalogue.html
          if grep --fixed-strings --quiet 'Something went wrong' deploy-evidence/catalogue.html; then exit 1; fi

          status="$(curl --silent --show-error --output deploy-evidence/gateway-404.json \
            --write-out '%{http_code}' "$PRODUCTION_GATEWAY_URL/release-contract-missing")"
          test "$status" = 404
          BODY=deploy-evidence/gateway-404.json node -e '
            const body = JSON.parse(require("node:fs").readFileSync(process.env.BODY, "utf8"));
            if (body.error !== "not found" || Object.keys(body).length !== 1) process.exit(1);
          '

      - name: Upload deployment evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: production-${{ env.RELEASE_SHA }}-${{ github.run_attempt }}
          path: deploy-evidence
          if-no-files-found: ignore
          retention-days: 7
