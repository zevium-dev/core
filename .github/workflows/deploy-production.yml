name: Deploy Production

on:
  workflow_run:
    workflows: [Continuous Integration]
    types: [completed]
    branches: [develop]

concurrency:
  group: production
  cancel-in-progress: false

permissions:
  contents: read

env:
  MISE_EXPERIMENTAL: true
  CLOUDFLARE_ACCOUNT_ID: 1ea9299555b026a6a7484c8323c5a953
  VITE_CONVEX_URL: https://polite-ermine-809.convex.cloud
  VITE_GATEWAY_URL: https://gateway.zevium.dev
  VERSION_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
  ZEVIUM_GIT_SHA: ${{ github.event.workflow_run.head_sha }}
  ZEVIUM_DEPLOYMENT_MODE: production

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'develop'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: jdx/mise-action@v4

      - name: Generate immutable deployment manifests
        run: |
          deployed_at="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)"
          {
            echo "ZEVIUM_DEPLOYED_AT=$deployed_at"
            echo "ZEVIUM_WEB_DEPLOYMENT_ID=$VERSION_TAG-web"
            echo "ZEVIUM_GATEWAY_DEPLOYMENT_ID=$VERSION_TAG-gateway"
            echo "ZEVIUM_CONVEX_DEPLOYMENT_ID=$VERSION_TAG-convex"
          } >> "$GITHUB_ENV"
          ZEVIUM_DEPLOYED_AT="$deployed_at" \
            ZEVIUM_WEB_DEPLOYMENT_ID="$VERSION_TAG-web" \
            ZEVIUM_GATEWAY_DEPLOYMENT_ID="$VERSION_TAG-gateway" \
            ZEVIUM_CONVEX_DEPLOYMENT_ID="$VERSION_TAG-convex" \
            node scripts/generate-deployment-manifests.mjs

      - name: Deploy Convex control plane
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PRODUCTION_DEPLOY_KEY }}
        run: pnpm exec convex deploy --yes

      - name: Deploy gateway Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --filter gateway exec wrangler versions upload --tag "$VERSION_TAG" \
            --var "ZEVIUM_GIT_SHA:$ZEVIUM_GIT_SHA" \
            --var "ZEVIUM_GATEWAY_DEPLOYMENT_ID:$ZEVIUM_GATEWAY_DEPLOYMENT_ID" \
            --var "ZEVIUM_DEPLOYED_AT:$ZEVIUM_DEPLOYED_AT" \
            --var "ZEVIUM_DEPLOYMENT_MODE:$ZEVIUM_DEPLOYMENT_MODE"
          pnpm --filter gateway exec wrangler versions deploy --version-tag "$VERSION_TAG" --yes

      - name: Build web Worker
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PRODUCTION_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_PRODUCTION_SECRET_KEY }}
        run: pnpm --filter web build

      - name: Deploy web Worker
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          pnpm --filter web exec wrangler versions upload --config dist/server/wrangler.json --tag "$VERSION_TAG"
          pnpm --filter web exec wrangler versions deploy --config dist/server/wrangler.json --version-tag "$VERSION_TAG" --yes

      - name: Smoke test production
        run: |
          gateway="$(curl --fail --silent --show-error https://gateway.zevium.dev/health)"
          [[ "$gateway" == *'"ok":true'* ]] || { echo "Gateway health response is invalid" >&2; exit 1; }
          [[ "$gateway" == *"\"gitSha\":\"$ZEVIUM_GIT_SHA\""* ]] || { echo "Gateway revision is stale" >&2; exit 1; }

          web="$(curl --fail --silent --show-error https://www.zevium.dev/)"
          [[ "$web" == *'One key. Every API. Pay per call.'* ]] || { echo "Landing page did not render" >&2; exit 1; }
          web_deployment="$(curl --fail --silent --show-error https://www.zevium.dev/.well-known/zevium-deployment.json)"
          [[ "$web_deployment" == *"\"gitSha\": \"$ZEVIUM_GIT_SHA\""* ]] || { echo "Web revision is stale" >&2; exit 1; }
