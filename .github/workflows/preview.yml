name: Pull Request Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose preview should be deployed and tested
        required: true
        type: number

concurrency:
  group: preview-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
  CLOUDFLARE_ACCOUNT_ID: 1ea9299555b026a6a7484c8323c5a953

jobs:
  security:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          version: 2026.7.13
          install: true
          install_args: node@24.15.0 npm:pnpm@11.8.0 actionlint@1.7.12 gitleaks@8.30.1 shellcheck@0.11.0
      - name: Verify exact Node and pnpm
        run: |
          test "$(node --version)" = "v24.15.0"
          test "$(pnpm --version)" = "11.8.0"
      - name: Verify dependency bootstrap policy
        run: node scripts/audit-preflight.mjs
      - name: Install dependencies without lifecycle scripts
        run: pnpm --filter . install --frozen-lockfile --ignore-pnpmfile --ignore-scripts --registry=https://registry.npmjs.org/ --config.trust-lockfile=false --config.verify-store-integrity=true
      - name: Verify dependency supply chain
        run: node scripts/audit.mjs

  preview-target:
    if: >-
      github.event_name == 'workflow_dispatch' || github.event.action != 'labeled' ||
      github.event.label.name == 'full-e2e'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ref: ${{ steps.target.outputs.ref }}
    steps:
      - name: Validate trusted preview target with gh CLI
        id: target
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          [[ "$GITHUB_ACTOR" == "tnfssc" ]] || {
            echo "Only trusted maintainer may execute secret-bearing preview" >&2
            exit 1
          }
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]] || {
            echo "Invalid pull request number" >&2
            exit 1
          }
          preview_sha="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" \
            | python3 -c 'import json, os, re, sys; pr = json.load(sys.stdin); assert pr["state"] == "open", "preview target PR is not open"; assert pr["head"]["repo"]["full_name"] == os.environ["GITHUB_REPOSITORY"], "fork previews cannot receive deployment secrets"; assert pr["user"]["login"] == "tnfssc", "preview target author is not trusted maintainer"; assert re.fullmatch(r"[0-9a-f]{40}", pr.get("merge_commit_sha") or ""), "preview merge commit is not ready"; sys.stdout.write(pr["merge_commit_sha"])')"
          echo "ref=$preview_sha" >> "$GITHUB_OUTPUT"

  preview-convex:
    needs: [security, preview-target]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: preview
    outputs:
      convex_url: ${{ steps.deploy.outputs.convex_url }}
      convex_site_url: ${{ steps.deploy.outputs.convex_site_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preview-target.outputs.ref }}
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          version: 2026.7.13
          install: true
          install_args: node@24.15.0 npm:pnpm@11.8.0 actionlint@1.7.12 gitleaks@8.30.1 shellcheck@0.11.0
      - name: Verify exact Node and pnpm
        run: |
          test "$(node --version)" = "v24.15.0"
          test "$(pnpm --version)" = "11.8.0"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Deploy isolated Convex backend
        id: deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        run: |
          pnpm exec convex deploy --preview-create "pr-$PR_NUMBER" \
            --cmd 'node .github/scripts/capture-preview-env.mjs' \
            --cmd-url-env-var-name CONVEX_URL

  gateway-preview:
    needs: [security, preview-target, preview-convex]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: preview
    outputs:
      gateway_url: ${{ steps.deploy.outputs.gateway_url }}
      release_sha: ${{ steps.deploy.outputs.release_sha }}
    env:
      VITE_CONVEX_URL: ${{ needs.preview-convex.outputs.convex_url }}
      CONVEX_SITE_URL: ${{ needs.preview-convex.outputs.convex_site_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preview-target.outputs.ref }}
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          version: 2026.7.13
          install: true
          install_args: node@24.15.0 npm:pnpm@11.8.0 actionlint@1.7.12 gitleaks@8.30.1 shellcheck@0.11.0
      - name: Verify exact Node and pnpm
        run: |
          test "$(node --version)" = "v24.15.0"
          test "$(pnpm --version)" = "11.8.0"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy isolated gateway Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLERK_PREVIEW_SECRET_KEY: ${{ secrets.CLERK_PREVIEW_SECRET_KEY }}
          GATEWAY_PREVIEW_INTERNAL_SECRET: ${{ secrets.GATEWAY_PREVIEW_INTERNAL_SECRET }}
        run: |
          gateway_name="zevium-gateway-pr-$PR_NUMBER"
          release_sha="$(git rev-parse HEAD)"
          pnpm --filter gateway build:compliance
          node scripts/check-compliance-claims.mjs --require-generated=gateway
          pnpm --filter gateway exec wrangler deploy --name "$gateway_name" --config wrangler.preview.jsonc \
            --var "CONVEX_URL:$VITE_CONVEX_URL" \
            --var "CONVEX_SITE_URL:$CONVEX_SITE_URL" \
            --var "ZEVIUM_RELEASE:$release_sha"
          printf '%s' "$CLERK_PREVIEW_SECRET_KEY" | pnpm --filter gateway exec wrangler secret put CLERK_SECRET_KEY --name "$gateway_name" --config wrangler.preview.jsonc
          printf '%s' "$GATEWAY_PREVIEW_INTERNAL_SECRET" | pnpm --filter gateway exec wrangler secret put GATEWAY_INTERNAL_SECRET --name "$gateway_name" --config wrangler.preview.jsonc
          # secret put mints a new current version without metadata; redeploy
          # last so the serving version carries the release tag proof.
          pnpm --filter gateway exec wrangler deploy --name "$gateway_name" --config wrangler.preview.jsonc \
            --tag "preview-$PR_NUMBER-$release_sha" \
            --var "CONVEX_URL:$VITE_CONVEX_URL" \
            --var "CONVEX_SITE_URL:$CONVEX_SITE_URL" \
            --var "ZEVIUM_RELEASE:$release_sha"
          echo "gateway_url=https://${gateway_name}.zevium-dev.workers.dev" >> "$GITHUB_OUTPUT"
          echo "release_sha=$release_sha" >> "$GITHUB_OUTPUT"

  web-build:
    needs: [security, preview-target, preview-convex]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: preview
    env:
      VITE_CONVEX_URL: ${{ needs.preview-convex.outputs.convex_url }}
      VITE_GATEWAY_URL: https://zevium-gateway-pr-${{ github.event.pull_request.number || inputs.pr_number }}.zevium-dev.workers.dev
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preview-target.outputs.ref }}
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          version: 2026.7.13
          install: true
          install_args: node@24.15.0 npm:pnpm@11.8.0 actionlint@1.7.12 gitleaks@8.30.1 shellcheck@0.11.0
      - name: Verify exact Node and pnpm
        run: |
          test "$(node --version)" = "v24.15.0"
          test "$(pnpm --version)" = "11.8.0"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build isolated web Worker
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PREVIEW_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_PREVIEW_SECRET_KEY }}
        run: VITE_BUILD_SHA="$(git rev-parse HEAD)" pnpm --filter web build
      - name: Scan exact web deploy inputs
        run: node scripts/check-compliance-claims.mjs --require-generated=web
      - name: Upload web Worker build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-web-${{ env.PR_NUMBER }}
          path: apps/web/dist
          if-no-files-found: error

  exact-compliance-surface:
    needs: preview-convex
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: preview
    env:
      VITE_CONVEX_URL: ${{ needs.preview-convex.outputs.convex_url }}
      VITE_GATEWAY_URL: https://zevium-gateway-pr-${{ github.event.pull_request.number || inputs.pr_number }}.zevium-dev.workers.dev
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          version: 2026.7.13
          install: true
          install_args: node@24.15.0 npm:pnpm@11.8.0 actionlint@1.7.12 gitleaks@8.30.1 shellcheck@0.11.0
      - name: Verify exact Node and pnpm
        run: |
          test "$(node --version)" = "v24.15.0"
          test "$(pnpm --version)" = "11.8.0"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Build and scan exact generated deploy surface
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PREVIEW_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_PREVIEW_SECRET_KEY }}
        run: |
          VITE_BUILD_SHA="$(git rev-parse HEAD)" pnpm build:compliance-inputs
          pnpm check:compliance-claims:deploy

  web-preview:
    needs: [security, preview-target, web-build]
    permissions:
      actions: read
      contents: read
      id-token: write
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: preview
    outputs:
      web_url: ${{ steps.deploy.outputs.web_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preview-target.outputs.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: preview-web-${{ env.PR_NUMBER }}
          path: apps/web/dist
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          version: 2026.7.13
          install: true
          install_args: node@24.15.0 npm:pnpm@11.8.0 actionlint@1.7.12 gitleaks@8.30.1 shellcheck@0.11.0
      - name: Verify exact Node and pnpm
        run: |
          test "$(node --version)" = "v24.15.0"
          test "$(pnpm --version)" = "11.8.0"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Deploy isolated web Worker
        id: deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLERK_PREVIEW_SECRET_KEY: ${{ secrets.CLERK_PREVIEW_SECRET_KEY }}
        run: |
          web_name="zevium-web-pr-$PR_NUMBER"
          WEB_NAME="$web_name" node -e 'const fs=require("node:fs"); const p="apps/web/dist/server/wrangler.json"; const c=JSON.parse(fs.readFileSync(p)); c.name=process.env.WEB_NAME; delete c.routes; fs.writeFileSync("apps/web/dist/server/wrangler.preview.json", JSON.stringify(c));'
          node scripts/check-compliance-claims.mjs --require-generated=web
          pnpm --filter web exec wrangler deploy --name "$web_name" --config dist/server/wrangler.preview.json
          printf '%s' "$CLERK_PREVIEW_SECRET_KEY" | pnpm --filter web exec wrangler secret put CLERK_SECRET_KEY --name "$web_name" --config dist/server/wrangler.preview.json
          echo "web_url=https://${web_name}.zevium-dev.workers.dev" >> "$GITHUB_OUTPUT"

  deploy-and-test:
    needs: [preview-target, gateway-preview, web-preview]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    outputs:
      web_url: ${{ needs.web-preview.outputs.web_url }}
      gateway_url: ${{ needs.gateway-preview.outputs.gateway_url }}
    env:
      E2E_BASE_URL: ${{ needs.web-preview.outputs.web_url }}
      GATEWAY_URL: ${{ needs.gateway-preview.outputs.gateway_url }}
      RELEASE_SHA: ${{ needs.gateway-preview.outputs.release_sha }}
    steps:
      - name: Verify preview deployment contract
        run: |
          mkdir -p e2e/artifacts

          wait_for_http_200() {
            url="$1"
            output="$2"
            for attempt in $(seq 1 30); do
              status="$(curl --location --silent --show-error --output "$output" \
                --connect-timeout 1 --max-time 1 \
                --write-out '%{http_code}' "$url" || true)"
              if [ "$status" = "200" ]; then
                return 0
              fi

              if [ "$attempt" -lt 30 ]; then
                sleep 2
              fi
            done

            echo "Preview did not become ready: $url returned HTTP $status" >&2
            return 1
          }

          wait_for_http_200 "$E2E_BASE_URL/" e2e/artifacts/landing.html
          grep --fixed-strings --quiet '<title>Zevium — Agent-first API marketplace</title>' \
            e2e/artifacts/landing.html
          grep --fixed-strings --quiet \
            "name=\"zevium-release\" content=\"$RELEASE_SHA\"" \
            e2e/artifacts/landing.html

          wait_for_http_200 "$E2E_BASE_URL/catalogue" e2e/artifacts/catalogue.html
          grep --fixed-strings --quiet '<title>Catalogue · Zevium</title>' \
            e2e/artifacts/catalogue.html
          grep --fixed-strings --quiet 'Public APIs with per-call credits' \
            e2e/artifacts/catalogue.html
          grep --fixed-strings --quiet \
            "name=\"zevium-release\" content=\"$RELEASE_SHA\"" \
            e2e/artifacts/catalogue.html
          if grep --fixed-strings --quiet 'Something went wrong' \
            e2e/artifacts/catalogue.html; then
            echo "Preview catalogue rendered error state" >&2
            exit 1
          fi

          wait_for_http_200 "$GATEWAY_URL/health" e2e/artifacts/gateway-health.json
          python3 -c 'import json, os; health = json.load(open("e2e/artifacts/gateway-health.json")); assert health.get("ok") is True and health.get("service") == "zevium-gateway" and health.get("release") == os.environ["RELEASE_SHA"] and health.get("contract") == 1, "Unexpected gateway health response"'

          preflight_status="$(curl --silent --show-error \
            --connect-timeout 1 --max-time 2 \
            --dump-header e2e/artifacts/gateway-cors.headers \
            --output /dev/null \
            --write-out '%{http_code}' --request OPTIONS \
            --header 'Origin: https://preview-contract.invalid' \
            --header 'Access-Control-Request-Method: GET' \
            --header 'Access-Control-Request-Headers: authorization, content-type' \
            "$GATEWAY_URL/gateway/missing-org/missing-project/ping")"
          test "$preflight_status" = "204"
          grep --ignore-case --quiet '^access-control-allow-origin: \*[[:space:]]*$' \
            e2e/artifacts/gateway-cors.headers
          grep --ignore-case '^access-control-allow-headers:' \
            e2e/artifacts/gateway-cors.headers | grep --ignore-case --quiet 'authorization'
          grep --ignore-case '^access-control-allow-headers:' \
            e2e/artifacts/gateway-cors.headers | grep --ignore-case --quiet 'content-type'
          grep --ignore-case '^access-control-allow-methods:' \
            e2e/artifacts/gateway-cors.headers | grep --ignore-case --quiet 'GET'

          missing_status="$(curl --silent --show-error \
            --connect-timeout 1 --max-time 2 \
            --dump-header e2e/artifacts/gateway-404.headers \
            --output e2e/artifacts/gateway-404.json \
            --write-out '%{http_code}' \
            "$GATEWAY_URL/preview-contract-missing")"
          test "$missing_status" = "404"
          grep --ignore-case --quiet '^content-type: application/json' \
            e2e/artifacts/gateway-404.headers
          python3 -c 'import json; body = json.load(open("e2e/artifacts/gateway-404.json")); assert body.get("error") == "not found" and len(body) == 1, "Unexpected gateway 404 contract"'

      - name: Upload contract failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-contract-${{ env.PR_NUMBER }}
          path: e2e/artifacts
          if-no-files-found: ignore

      - name: Publish preview links
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const marker = '<!-- zevium-preview -->'
            const body = `${marker}\nPreview ready:\n- Web: ${process.env.E2E_BASE_URL}\n- Gateway: ${process.env.GATEWAY_URL}`
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number })
            const prior = comments.find((comment) => comment.body?.includes(marker))
            if (prior) await github.rest.issues.updateComment({ ...context.repo, comment_id: prior.id, body })
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })

  full-e2e:
    needs: [preview-target, deploy-and-test]
    if: >-
      needs.deploy-and-test.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'full-e2e'))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    environment: preview
    env:
      E2E_BASE_URL: ${{ needs.deploy-and-test.outputs.web_url }}
      E2E_EXPECTED_COMMIT: ${{ needs.preview-target.outputs.ref }}
      PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preview-target.outputs.ref }}
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
        with:
          version: 2026.7.13
          install: true
          install_args: node@24.15.0 npm:pnpm@11.8.0 actionlint@1.7.12 gitleaks@8.30.1 shellcheck@0.11.0
      - name: Verify exact Node and pnpm
        run: |
          test "$(node --version)" = "v24.15.0"
          test "$(pnpm --version)" = "11.8.0"
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Install browser runtime
        run: |
          pnpm exec agent-browser install --with-deps
      - name: Provision preview E2E user
        env:
          CLERK_PREVIEW_SECRET_KEY: ${{ secrets.CLERK_PREVIEW_SECRET_KEY }}
          E2E_EMAIL: ${{ secrets.PREVIEW_E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.PREVIEW_E2E_PASSWORD }}
        run: node .github/scripts/ensure-e2e-user.mjs
      - name: Run authenticated publish and catalogue journey
        env:
          GATEWAY_URL: ""
          E2E_EMAIL: ${{ secrets.PREVIEW_E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.PREVIEW_E2E_PASSWORD }}
          E2E_OTP: ${{ secrets.PREVIEW_E2E_OTP }}
        run: |
          if e2e/run-all.sh; then
            exit 0
          fi

          echo "Authenticated preview was not ready; retrying once after propagation delay"
          sleep 30
          E2E_SESSION="zevium-e2e-retry-$PR_NUMBER" e2e/run-all.sh

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-e2e-${{ env.PR_NUMBER }}
          path: |
            e2e/artifacts/**/*.png
            e2e/artifacts/**/*.url.txt
            e2e/artifacts/**/*.snapshot.txt
          if-no-files-found: ignore
