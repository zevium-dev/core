name: Pull Request Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number whose preview should be deployed and tested
        required: true
        type: number

concurrency:
  group: preview-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  MISE_EXPERIMENTAL: true
  PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}

jobs:
  preview-context:
    if: >-
      github.actor == 'tnfssc' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.head.repo.full_name == github.repository &&
      (github.event.action != 'labeled' || github.event.label.name == 'full-e2e')))
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      checkout_sha: ${{ steps.context.outputs.checkout_sha }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      pr_number: ${{ steps.context.outputs.pr_number }}
    steps:
      - name: Resolve immutable internal PR context
        id: context
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const number = context.eventName === 'pull_request'
              ? context.payload.pull_request.number
              : Number('${{ inputs.pr_number }}')
            const pr = context.eventName === 'pull_request'
              ? context.payload.pull_request
              : (await github.rest.pulls.get({ ...context.repo, pull_number: number })).data
            if (pr.state !== 'open') core.setFailed('Preview PR must be open')
            if (pr.base.ref !== 'develop') core.setFailed('Preview PR base must be develop')
            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Fork previews are forbidden')
            }
            core.setOutput('pr_number', String(number))
            core.setOutput('head_sha', pr.head.sha)
            core.setOutput('checkout_sha', context.eventName === 'pull_request' ? context.sha : pr.head.sha)

  preview-convex:
    needs: preview-context
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: preview
    outputs:
      convex_url: ${{ steps.deploy.outputs.convex_url }}
      convex_site_url: ${{ steps.deploy.outputs.convex_site_url }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preview-context.outputs.checkout_sha }}
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Deploy isolated Convex backend
        id: deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
          PR_NUMBER: ${{ needs.preview-context.outputs.pr_number }}
        run: |
          ZEVIUM_DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            ZEVIUM_WEB_DEPLOYMENT_ID="$VERSION_TAG-web" \
            ZEVIUM_GATEWAY_DEPLOYMENT_ID="$VERSION_TAG-gateway" \
            ZEVIUM_CONVEX_DEPLOYMENT_ID="$VERSION_TAG-convex" \
            node scripts/generate-deployment-manifests.mjs
          pnpm exec convex deploy --preview-create "pr-$PR_NUMBER" \
            --cmd 'node .github/scripts/capture-preview-env.mjs' \
            --cmd-url-env-var-name CONVEX_URL

  web-build:
    needs: [preview-context, preview-convex]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: preview
    env:
      VITE_CONVEX_URL: ${{ needs.preview-convex.outputs.convex_url }}
      VITE_GATEWAY_URL: https://zevium-gateway-pr-${{ needs.preview-context.outputs.pr_number }}.zevium-dev.workers.dev
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preview-context.outputs.checkout_sha }}
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
      - name: Build isolated web Worker
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PREVIEW_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_PREVIEW_SECRET_KEY }}
        run: |
          ZEVIUM_DEPLOYED_AT="$(date -u +%Y-%m-%dT%H:%M:%S.000Z)" \
            ZEVIUM_WEB_DEPLOYMENT_ID="$VERSION_TAG-web" \
            ZEVIUM_GATEWAY_DEPLOYMENT_ID="$VERSION_TAG-gateway" \
            ZEVIUM_CONVEX_DEPLOYMENT_ID="$VERSION_TAG-convex" \
            node scripts/generate-deployment-manifests.mjs
          pnpm --filter web build
      - name: Upload web Worker build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-web-${{ needs.preview-context.outputs.pr_number }}
          path: apps/web/dist
          if-no-files-found: error

  gateway-preview:
    needs: [preview-context, preview-convex]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cloudflare-preview.yml
    with:
      checkout_sha: ${{ needs.preview-context.outputs.checkout_sha }}
      component: gateway
      convex_site_url: ${{ needs.preview-convex.outputs.convex_site_url }}
      convex_url: ${{ needs.preview-convex.outputs.convex_url }}
      head_sha: ${{ needs.preview-context.outputs.head_sha }}
      pr_number: ${{ fromJSON(needs.preview-context.outputs.pr_number) }}

  web-preview:
    needs: [preview-context, web-build]
    permissions:
      actions: read
      contents: read
      id-token: write
    uses: ./.github/workflows/cloudflare-preview.yml
    with:
      artifact_name: preview-web-${{ needs.preview-context.outputs.pr_number }}
      checkout_sha: ${{ needs.preview-context.outputs.checkout_sha }}
      component: web
      head_sha: ${{ needs.preview-context.outputs.head_sha }}
      pr_number: ${{ fromJSON(needs.preview-context.outputs.pr_number) }}

  deploy-and-test:
    needs: [gateway-preview, web-preview]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    environment: preview
    permissions:
      contents: read
      pull-requests: write
    outputs:
      web_url: ${{ needs.web-preview.outputs.deploy_url }}
      gateway_url: ${{ needs.gateway-preview.outputs.deploy_url }}
    env:
      E2E_BASE_URL: ${{ needs.web-preview.outputs.deploy_url }}
      GATEWAY_URL: ${{ needs.gateway-preview.outputs.deploy_url }}
    steps:
      - name: Verify preview deployment contract
        run: |
          mkdir -p e2e/artifacts

          wait_for_http_200() {
            url="$1"
            output="$2"

            for attempt in $(seq 1 45); do
              status="$(curl --location --silent --show-error --output "$output" \
                --write-out '%{http_code}' "$url" || true)"
              if [ "$status" = "200" ]; then
                return 0
              fi

              if [ "$attempt" -lt 45 ]; then
                sleep 2
              fi
            done

            echo "Preview did not become ready: $url returned HTTP $status" >&2
            return 1
          }

          wait_for_http_200 "$E2E_BASE_URL/" e2e/artifacts/landing.html
          grep --fixed-strings --quiet '<title>Zevium — Agent-first API marketplace</title>' \
            e2e/artifacts/landing.html

          wait_for_http_200 "$E2E_BASE_URL/catalogue" e2e/artifacts/catalogue.html
          grep --fixed-strings --quiet '<title>Catalogue · Zevium</title>' \
            e2e/artifacts/catalogue.html

          wait_for_http_200 "$GATEWAY_URL/health" e2e/artifacts/gateway-health.json
          health="$(cat e2e/artifacts/gateway-health.json)"
          case "$health" in
            *'"ok":true'*'"service":"zevium-gateway"'*) ;;
            *) echo "Unexpected gateway health response" >&2; exit 1 ;;
          esac

          preflight_status="$(curl --silent --show-error --output /dev/null \
            --write-out '%{http_code}' --request OPTIONS \
            --header 'Origin: https://preview-contract.invalid' \
            --header 'Access-Control-Request-Method: GET' \
            "$GATEWAY_URL/gateway/missing-org/missing-project/ping")"
          test "$preflight_status" = "204"

          missing_status="$(curl --silent --show-error --output e2e/artifacts/gateway-404.json \
            --write-out '%{http_code}' \
            "$GATEWAY_URL/preview-contract-missing")"
          test "$missing_status" = "404"

      - name: Upload contract failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-contract-${{ env.PR_NUMBER }}
          path: e2e/artifacts
          if-no-files-found: ignore

      - name: Publish preview links
        if: github.event_name == 'pull_request'
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const marker = '<!-- zevium-preview -->'
            const body = `${marker}\nPreview ready:\n- Web: ${process.env.E2E_BASE_URL}\n- Gateway: ${process.env.GATEWAY_URL}`
            const { data: comments } = await github.rest.issues.listComments({ ...context.repo, issue_number: context.issue.number })
            const prior = comments.find((comment) => comment.body?.includes(marker))
            if (prior) await github.rest.issues.updateComment({ ...context.repo, comment_id: prior.id, body })
            else await github.rest.issues.createComment({ ...context.repo, issue_number: context.issue.number, body })

  full-e2e:
    needs: [preview-context, deploy-and-test]
    if: >-
      needs.deploy-and-test.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
      (github.event.action == 'labeled' && github.event.label.name == 'full-e2e'))
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 20
    environment: preview
    env:
      E2E_BASE_URL: ${{ needs.deploy-and-test.outputs.web_url }}
      PR_NUMBER: ${{ needs.preview-context.outputs.pr_number }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.preview-context.outputs.checkout_sha }}
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4
      - name: Install browser runtime
        run: |
          npm install --global agent-browser@0.27.1
          agent-browser install --with-deps
      - name: Run authenticated publish and catalogue journey
        env:
          GATEWAY_URL: ""
          E2E_EMAIL: ${{ secrets.PREVIEW_E2E_EMAIL }}
          E2E_PASSWORD: ${{ secrets.PREVIEW_E2E_PASSWORD }}
          E2E_OTP: ${{ secrets.PREVIEW_E2E_OTP }}
        run: |
          if e2e/run-all.sh; then
            exit 0
          fi

          echo "Authenticated preview was not ready; retrying once after propagation delay"
          sleep 30
          E2E_SESSION="zevium-e2e-retry-$PR_NUMBER" e2e/run-all.sh

      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: preview-e2e-${{ env.PR_NUMBER }}
          path: e2e/artifacts
          if-no-files-found: ignore
