name: Cloudflare Production Deployment

on:
  workflow_call:
    inputs:
      head_sha:
        required: true
        type: string
      source_run_id:
        required: true
        type: string

permissions:
  contents: read
  id-token: write

env:
  MISE_EXPERIMENTAL: true
  CLOUDFLARE_ACCOUNT_ID: 1ea9299555b026a6a7484c8323c5a953
  VITE_CONVEX_URL: https://polite-ermine-809.convex.cloud
  VITE_GATEWAY_URL: https://gateway.zevium.dev
  VERSION_TAG: ci-${{ github.run_id }}-${{ github.run_attempt }}
  WRANGLER_SEND_ERROR_REPORTS: false
  WRANGLER_SEND_METRICS: false

jobs:
  deploy:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    environment: production
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ inputs.head_sha }}
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: jdx/mise-action@7e36c90d9ab29c415a2384db3006f3ec8a8cc654 # v4

      - name: Deploy Convex control plane
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_PRODUCTION_DEPLOY_KEY }}
        run: pnpm exec convex deploy --yes

      - name: Deploy gateway Worker through broker
        env:
          DEPLOY_HEAD_SHA: ${{ inputs.head_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          broker_env="$(mktemp)"
          trap 'rm -f "$broker_env"' EXIT
          BROKER_ENV_FILE="$broker_env" node --experimental-strip-types \
            apps/deploy-broker/scripts/register.ts --profile production-gateway
          set -a
          . "$broker_env"
          set +a
          pnpm --filter gateway exec wrangler versions upload --tag "$VERSION_TAG"
          pnpm --filter gateway exec wrangler versions deploy \
            --config ../deploy-broker/wrangler-client.jsonc \
            --name zevium-gateway --version-tag "$VERSION_TAG" --yes

      - name: Build web Worker
        env:
          CLERK_PUBLISHABLE_KEY: ${{ secrets.CLERK_PRODUCTION_PUBLISHABLE_KEY }}
          CLERK_SECRET_KEY: ${{ secrets.CLERK_PRODUCTION_SECRET_KEY }}
        run: pnpm --filter web build

      - name: Deploy web Worker through broker
        env:
          DEPLOY_HEAD_SHA: ${{ inputs.head_sha }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          broker_env="$(mktemp)"
          trap 'rm -f "$broker_env"' EXIT
          BROKER_ENV_FILE="$broker_env" node --experimental-strip-types \
            apps/deploy-broker/scripts/register.ts --profile production-web
          set -a
          . "$broker_env"
          set +a
          pnpm --filter web exec wrangler versions upload \
            --config dist/server/wrangler.json --tag "$VERSION_TAG"
          pnpm --filter web exec wrangler versions deploy \
            --config ../deploy-broker/wrangler-client.jsonc \
            --name zevium-dev --version-tag "$VERSION_TAG" --yes

      - name: Smoke test production
        run: |
          gateway="$(curl --fail --silent --show-error https://gateway.zevium.dev/health)"
          [[ "$gateway" == *'"ok":true'* ]] || { echo "Gateway health response is invalid" >&2; exit 1; }

          web="$(curl --fail --silent --show-error https://www.zevium.dev/)"
          [[ "$web" == *'One key. Every API. Pay per call.'* ]] || { echo "Landing page did not render" >&2; exit 1; }
