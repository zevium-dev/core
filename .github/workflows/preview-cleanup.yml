name: Pull Request Preview Cleanup

on:
  pull_request_target:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to clean up
        required: true
        type: number

concurrency:
  group: preview-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup-context:
    if: >-
      github.actor == 'tnfssc' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr_number: ${{ steps.context.outputs.pr_number }}
    steps:
      - name: Resolve immutable closed PR context
        id: context
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const number = context.eventName === 'pull_request_target'
              ? context.payload.pull_request.number
              : Number('${{ inputs.pr_number }}')
            const pr = context.eventName === 'pull_request_target'
              ? context.payload.pull_request
              : (await github.rest.pulls.get({ ...context.repo, pull_number: number })).data
            if (pr.state !== 'closed') core.setFailed('Cleanup PR must be closed')
            if (pr.base.ref !== 'develop') core.setFailed('Cleanup PR base must be develop')
            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Fork cleanup identity is forbidden')
            }
            core.setOutput('pr_number', String(number))

  cleanup:
    needs: cleanup-context
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    environment: preview
    env:
      CLOUDFLARE_ACCOUNT_ID: 1ea9299555b026a6a7484c8323c5a953
      PR_NUMBER: ${{ needs.cleanup-context.outputs.pr_number }}
    steps:
      - name: Delete isolated Workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          response_body="$(mktemp)"
          trap 'rm -f "$response_body"' EXIT

          delete_worker() {
            worker="$1"
            status="$(curl --silent --show-error --output "$response_body" \
              --write-out '%{http_code}' --request DELETE \
              --header "Authorization: Bearer $CLOUDFLARE_API_TOKEN" \
              "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$worker")"

            if [ "$status" = "200" ] || [ "$status" = "404" ]; then
              echo "Removed $worker"
              return
            fi
            echo "Failed to remove $worker (HTTP $status)" >&2
            return 1
          }

          failed=0
          delete_worker "zevium-web-pr-$PR_NUMBER" || failed=1
          delete_worker "zevium-gateway-pr-$PR_NUMBER" || failed=1
          exit "$failed"

      - name: Delete isolated Convex preview
        if: ${{ !cancelled() }}
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          CONVEX_PREVIEW_DEPLOY_KEY: ${{ secrets.CONVEX_PREVIEW_DEPLOY_KEY }}
        with:
          script: |
            const key = process.env.CONVEX_PREVIEW_DEPLOY_KEY
            const match = /^preview:([^:|]+):([^:|]+)\|.+$/.exec(key || '')
            const pr = process.env.PR_NUMBER
            if (!match || !/^[1-9][0-9]*$/.test(pr || '')) {
              throw new Error('Valid preview deploy key and PR number required')
            }
            const previewName = `pr-${pr}`
            const headers = { Authorization: `Bearer ${key}`, 'Content-Type': 'application/json' }
            const response = await fetch('https://api.convex.dev/api/deployment/authorize_preview', {
              method: 'POST',
              headers,
              signal: AbortSignal.timeout(30000),
              body: JSON.stringify({
                previewName,
                projectSelection: {
                  kind: 'teamAndProjectSlugs',
                  teamSlug: match[1],
                  projectSlug: match[2],
                },
              }),
            })
            const deployment = await response.json()
            if (response.status === 404 && deployment.code === 'PreviewNotFound') {
              core.info(`Convex preview ${previewName} already absent`)
              return
            }
            if (!response.ok) throw new Error(`Convex preview lookup failed (HTTP ${response.status})`)
            if (deployment.deploymentType !== 'preview' ||
                deployment.reference !== `preview/${previewName}` ||
                !/^[a-z0-9-]+$/.test(deployment.deploymentName || '')) {
              throw new Error('Convex preview identity mismatch; refusing deletion')
            }
            const deleted = await fetch(`https://api.convex.dev/v1/deployments/${deployment.deploymentName}/delete`, {
              method: 'POST',
              headers,
              signal: AbortSignal.timeout(30000),
            })
            if (!deleted.ok && deleted.status !== 404) {
              throw new Error(`Convex preview deletion failed (HTTP ${deleted.status})`)
            }
            core.info(`Removed Convex preview ${previewName}`)
