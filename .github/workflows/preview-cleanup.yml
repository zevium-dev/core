name: Pull Request Preview Cleanup

on:
  pull_request:
    types: [closed]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to clean up
        required: true
        type: number

concurrency:
  group: preview-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup-context:
    if: >-
      github.actor == 'tnfssc' &&
      (github.event_name == 'workflow_dispatch' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    permissions:
      contents: read
      pull-requests: read
    outputs:
      checkout_sha: ${{ steps.context.outputs.checkout_sha }}
      head_sha: ${{ steps.context.outputs.head_sha }}
      pr_number: ${{ steps.context.outputs.pr_number }}
    steps:
      - name: Resolve immutable closed PR context
        id: context
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        with:
          script: |
            const number = context.eventName === 'pull_request'
              ? context.payload.pull_request.number
              : Number('${{ inputs.pr_number }}')
            const pr = context.eventName === 'pull_request'
              ? context.payload.pull_request
              : (await github.rest.pulls.get({ ...context.repo, pull_number: number })).data
            if (pr.state !== 'closed') core.setFailed('Cleanup PR must be closed')
            if (pr.base.ref !== 'develop') core.setFailed('Cleanup PR base must be develop')
            if (pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}`) {
              core.setFailed('Fork cleanup identity is forbidden')
            }
            core.setOutput('pr_number', String(number))
            core.setOutput('head_sha', pr.head.sha)
            core.setOutput('checkout_sha', context.sha)

  cleanup:
    needs: cleanup-context
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cloudflare-cleanup.yml
    with:
      checkout_sha: ${{ needs.cleanup-context.outputs.checkout_sha }}
      head_sha: ${{ needs.cleanup-context.outputs.head_sha }}
      pr_number: ${{ fromJSON(needs.cleanup-context.outputs.pr_number) }}
