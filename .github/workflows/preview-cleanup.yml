name: Pull Request Preview Cleanup

on:
  pull_request:
    types: [closed]

concurrency:
  group: preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: 1ea9299555b026a6a7484c8323c5a953
      PR_NUMBER: ${{ github.event.pull_request.number }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: jdx/mise-action@v4
      - name: Delete isolated Workers
        run: |
          pnpm --filter web exec wrangler delete "zevium-web-pr-$PR_NUMBER" --force || true
          pnpm --filter gateway exec wrangler delete "zevium-gateway-pr-$PR_NUMBER" --force || true
      # Convex preview deployments expire automatically after five days on
      # Free/Starter plans; Convex CLI exposes no explicit preview-delete command.
