name: Continuous Integration

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["*"]
    branches: ["develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      - name: Initialize local Convex for code generation
        env:
          CONVEX_AGENT_MODE: anonymous
          CLERK_JWT_ISSUER_DOMAIN: https://clerk.invalid
        run: |
          pnpm exec convex init
          pnpm exec convex env set CLERK_JWT_ISSUER_DOMAIN https://clerk.invalid
      - name: Run uncached PR quality gate
        env:
          TURBO_FORCE: "true"
          CI: "true"
          CONVEX_AGENT_MODE: anonymous
        run: pnpm ci:pr
