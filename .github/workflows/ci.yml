name: Continuous Integration

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["*"]
    branches: ["develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          architecture: x64
          check-latest: false
          package-manager-cache: false
      - name: Verify dependency bootstrap policy
        run: node scripts/audit-preflight.mjs
      - name: Enable integrity-bound package manager
        run: corepack enable pnpm
      - name: Install dependencies without lifecycle scripts
        run: pnpm --filter . install --frozen-lockfile --ignore-pnpmfile --ignore-scripts --registry=https://registry.npmjs.org/ --config.trust-lockfile=false --config.verify-store-integrity=true
      - name: Verify dependency supply chain
        run: node scripts/audit.mjs

  quality:
    needs: security
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          architecture: x64
          check-latest: false
          package-manager-cache: false
      - name: Verify dependency bootstrap policy
        run: node scripts/audit-preflight.mjs
      - name: Enable integrity-bound package manager
        run: corepack enable pnpm
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-pnpmfile --ignore-scripts --registry=https://registry.npmjs.org/ --config.trust-lockfile=false --config.verify-store-integrity=true
      - name: Run allowlisted dependency lifecycle scripts
        run: pnpm rebuild
      - run: pnpm exec prettier --check .
      - run: pnpm typecheck

  tests:
    needs: security
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24.15.0
          architecture: x64
          check-latest: false
          package-manager-cache: false
      - name: Verify dependency bootstrap policy
        run: node scripts/audit-preflight.mjs
      - name: Enable integrity-bound package manager
        run: corepack enable pnpm
      - name: Install dependencies without lifecycle scripts
        run: pnpm install --frozen-lockfile --ignore-pnpmfile --ignore-scripts --registry=https://registry.npmjs.org/ --config.trust-lockfile=false --config.verify-store-integrity=true
      - name: Run allowlisted dependency lifecycle scripts
        run: pnpm rebuild
      - run: pnpm test

  ci:
    needs: [quality, tests, security]
    if: always()
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 2
    steps:
      - name: Require quality and tests to pass
        env:
          QUALITY: ${{ needs.quality.result }}
          SECURITY: ${{ needs.security.result }}
          TESTS: ${{ needs.tests.result }}
        run: |
          test "$QUALITY" = "success"
          test "$SECURITY" = "success"
          test "$TESTS" = "success"
