name: Continuous Integration

on:
  workflow_dispatch:
  pull_request:
  push:
    tags: ["*"]
    branches: ["develop"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # `pnpm ci:pr`, split into parallel slices. Keep the slices covering every
  # step of ci:pr. Every slice ends with routes:check and diff:check because
  # schema:check and the web build regenerate tracked files.
  quality:
    name: quality (${{ matrix.slice }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - slice: static
            command: pnpm ci:static
          - slice: test
            command: pnpm test
          - slice: build
            command: pnpm build:ci
          - slice: control-plane
            command: pnpm ci:control-plane
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: ./.github/actions/setup
      # PRs restore turbo results from their own branch and develop. Every
      # other event (the develop push that gates production) runs uncached
      # and only writes the cache.
      - uses: actions/cache@caa296126883cff596d87d8935842f9db880ef25 # v5
        with:
          path: .turbo/cache
          key: turbo-${{ runner.os }}-${{ matrix.slice }}-${{ github.sha }}
          restore-keys: turbo-${{ runner.os }}-${{ matrix.slice }}-
      - name: Run ${{ matrix.slice }} slice
        env:
          VITEST_MAX_WORKERS: "2"
          TURBO_CACHE_DIR: .turbo/cache
          TURBO_FORCE: ${{ github.event_name != 'pull_request' }}
          CI: "true"
          CONVEX_AGENT_MODE: anonymous
        run: ${{ matrix.command }}
      - name: Check generated files and whitespace
        run: pnpm routes:check && pnpm diff:check

  # Single required check and the job the production deploy's CI run depends on.
  ci:
    if: always()
    needs: [quality]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    steps:
      - name: Require every slice to pass
        env:
          QUALITY: ${{ needs.quality.result }}
        run: test "$QUALITY" = success
